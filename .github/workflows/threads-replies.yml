#  스레드 댓글 답변
#
#  한 시간에 한 번 내 글에 달린 댓글을 훑는다.
#  답해도 되는 것만 답하고, 애매한 것은 답하지 않고 이슈로 넘긴다.
#
#  "이미 답했는가"는 스레드 API 로 판단한다. 러너가 매번 새로 떠도 두 번 답하지 않는다.
#  답글이 너무 자주/느리게 달리면 아래 cron 을 고친다 (비공개 저장소는 실행 시간이 과금된다).

name: 스레드 댓글

on:
  schedule:
    - cron: '25 * * * *'   # 매시 25분
  workflow_dispatch:
    inputs:
      dry_run:
        description: '답글을 달지 않고 무엇을 답할지만 본다'
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

concurrency:
  group: threads-replies
  cancel-in-progress: false

jobs:
  replies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 댓글 확인과 답변
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          THREADS_PAUSED: ${{ vars.THREADS_PAUSED }}
          THREADS_MAX_REPLIES_PER_RUN: ${{ vars.THREADS_MAX_REPLIES_PER_RUN }}
          THREADS_REPLY_MAX_AGE_HOURS: ${{ vars.THREADS_REPLY_MAX_AGE_HOURS }}
          THREADS_MODEL: ${{ vars.THREADS_MODEL }}
        run: |
          node scripts/threads/replies.mjs ${{ inputs.dry_run && '--dry-run' || '' }}
