#  PR 검사
#
#  머지하기 전에 배관이 깨지지 않았는지 확인한다. 진짜 스레드나 네이버에 붙지 않는다.
#
#  원고 검사는 이 PR 에서 바뀐 .md 만 본다. 저장소에 남아 있는 옛 초안까지 걸면
#  손대지도 않은 글 때문에 빨개진다.

name: 검사

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 문법
        run: |
          fail=0
          while IFS= read -r f; do
            node --check "$f" || { echo "문법 오류: $f"; fail=1; }
          done < <(find scripts -name '*.mjs')
          exit $fail
        shell: bash

      # 2026-10-09: PC 끄기 스크립트의 괄호 하나 때문에 창이 아예 안 떴다 — PC 쪽 PowerShell 문법도 여기서 잡는다
      - name: PowerShell 문법
        run: |
          $bad = 0
          Get-ChildItem launchers -Recurse -Filter *.ps1 | ForEach-Object {
            $e = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$e)
            if ($e) { $bad = 1; $e | ForEach-Object { Write-Host "문법 오류: $($_.Extent.File):$($_.Extent.StartLineNumber) $($_.Message)" } }
          }
          exit $bad
        shell: pwsh

      - name: 워크플로 YAML
        run: |
          python3 - <<'PY'
          import glob, sys, yaml
          bad = 0
          for f in sorted(glob.glob('.github/workflows/*.yml')):
              try:
                  d = yaml.safe_load(open(f, encoding='utf-8'))
                  assert d.get('jobs'), 'jobs 가 없습니다'
                  print(f'  OK  {f}')
              except Exception as e:
                  print(f'  실패 {f} — {e}')
                  bad = 1
          sys.exit(bad)
          PY

      - name: 스레드 자동화 자체 점검
        run: npm run threads:selftest

      - name: 바뀐 원고 검사
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$BASE_SHA" ]; then
            echo "PR 이 아니라 비교 대상이 없습니다. 건너뜁니다."
            exit 0
          fi
          mapfile -t changed < <(git diff --name-only --diff-filter=d "$BASE_SHA" HEAD -- 'content/posts/*.md')
          if [ ${#changed[@]} -eq 0 ]; then
            echo "바뀐 원고가 없습니다."
            exit 0
          fi
          printf '검사할 원고: %s\n' "${changed[@]}"
          node scripts/lint-post.mjs "${changed[@]}"
        shell: bash

      - name: 바뀐 스레드 보험 묶음 검사
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$BASE_SHA" ]; then
            echo "PR 이 아니라 비교 대상이 없습니다. 건너뜁니다."
            exit 0
          fi
          mapfile -t changed < <(git diff --name-only --diff-filter=d "$BASE_SHA" HEAD -- 'content/threads/insurance/sets/*.md')
          if [ ${#changed[@]} -eq 0 ]; then
            echo "바뀐 묶음이 없습니다."
            exit 0
          fi
          node scripts/threads/insurance-set.mjs "${changed[@]}"
        shell: bash

      - name: 바뀐 티스토리 원고 검사
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$BASE_SHA" ]; then
            echo "PR 이 아니라 비교 대상이 없습니다. 건너뜁니다."
            exit 0
          fi
          mapfile -t changed < <(git diff --name-only --diff-filter=d "$BASE_SHA" HEAD -- 'content/tistory/*.md')
          if [ ${#changed[@]} -eq 0 ]; then
            echo "바뀐 티스토리 원고가 없습니다."
            exit 0
          fi
          printf '검사할 원고: %s\n' "${changed[@]}"
          node scripts/lint-tistory.mjs "${changed[@]}"
        shell: bash
