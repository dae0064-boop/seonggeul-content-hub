#  스레드 토큰 갱신
#
#  스레드 장기 토큰은 60일이면 만료된다. 만료되면 발행도 댓글 답변도 전부 멈춘다.
#  매달 1일과 15일에 갱신해 여유를 둔다.
#
#  THREADS_SECRET_PAT 를 넣어두면 갱신한 토큰을 Secret 에 자동으로 덮어쓴다.
#  없으면 갱신만 하고 "직접 바꾸라"는 이슈를 연다 (그 경우 60일마다 손이 한 번 간다).
#
#  THREADS_SECRET_PAT: 이 저장소의 Secrets 에 쓰기 권한이 있는 파인그레인드 토큰
#    Repository permissions > Secrets: Read and write, Metadata: Read-only

name: 스레드 토큰 갱신

on:
  schedule:
    - cron: '0 2 1,15 * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: threads-token
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PAT: ${{ secrets.THREADS_SECRET_PAT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 토큰 갱신
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/threads/refresh-token.mjs --out "$RUNNER_TEMP/threads-token.txt"

      - name: 새 토큰을 Secret 에 저장
        if: env.PAT != ''
        env:
          GH_TOKEN: ${{ secrets.THREADS_SECRET_PAT }}
        run: |
          gh secret set THREADS_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY" < "$RUNNER_TEMP/threads-token.txt"
          echo "THREADS_ACCESS_TOKEN 을 갱신했습니다."

      - name: PAT 가 없으면 사람에게 알린다
        if: env.PAT == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "[스레드] 토큰을 직접 갱신해 주세요" \
            --label threads-hold \
            --body "$(cat <<'EOF'
          스레드 토큰 갱신은 됐지만, 새 토큰을 Secret 에 저장할 권한이 없어 반영하지 못했습니다.

          둘 중 하나를 하세요.

          1. `THREADS_SECRET_PAT` 를 저장소 Secrets 에 넣는다 (한 번만 하면 이후 자동)
          2. `docs/THREADS.md` 의 "토큰 다시 받기" 대로 손으로 갱신한다

          그냥 두면 토큰 만료와 함께 발행·댓글 답변이 멈춥니다.
          EOF
          )"

      - name: 토큰 파일 지우기
        if: always()
        run: rm -f "$RUNNER_TEMP/threads-token.txt"
