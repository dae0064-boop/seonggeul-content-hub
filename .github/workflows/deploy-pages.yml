name: 콘텐츠 허브 배포

# 검수를 통과한 콘텐츠만 고정 링크에 배포한다.
# 새 링크를 만들지 않는다. 같은 주소를 덮어쓴다.
on:
  push:
    branches:
      - main
      - claude/seonggeul-content-hub-integration-cp1q8s
    paths:
      - "content-hub-site/**"
      - "scripts/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 동시 배포를 막는다. 배포는 하루 한 번이면 충분하다.
concurrency:
  group: content-hub-pages
  cancel-in-progress: true

jobs:
  validate:
    name: 원고 검수
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 문법·분량·구성·중복 일괄 검사
        run: node scripts/validate-content.mjs

  deploy:
    name: 고정 링크 갱신
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: content-hub-site
      - id: deployment
        uses: actions/deploy-pages@v4

  verify:
    name: 링크 확인
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 오늘 날짜가 표시되는지 확인
        run: |
          TODAY=$(TZ=Asia/Seoul date +%Y-%m-%d)
          DATA_DATE=$(grep -m1 -oP 'date:\s*"\K[0-9-]+' content-hub-site/content-data.js)
          echo "오늘(KST): $TODAY / 콘텐츠 기준일: $DATA_DATE"
          if [ "$TODAY" != "$DATA_DATE" ]; then
            echo "::warning::콘텐츠 기준일($DATA_DATE)이 오늘($TODAY)과 다릅니다."
          else
            echo "콘텐츠 기준일이 오늘과 일치합니다."
          fi
