#  스레드 자동화 점검
#
#  아무것도 올리지 않고 연결 상태만 확인한다.
#  설정을 처음 끝냈을 때, 그리고 뭔가 안 돌 때 Actions 탭에서 직접 돌린다.

name: 스레드 점검

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  doctor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 점검
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          THREADS_PAUSED: ${{ vars.THREADS_PAUSED }}
          THREADS_MAX_POSTS_PER_DAY: ${{ vars.THREADS_MAX_POSTS_PER_DAY }}
          THREADS_MODEL: ${{ vars.THREADS_MODEL }}
        run: node scripts/threads/doctor.mjs
