#  스레드 자동 발행
#
#  하루 네 번, 한국시간 아침·점심·저녁·밤에 글을 한 편 만들어 올린다.
#  사람이 손대지 않아도 돌고, 안전장치에 걸리면 올리지 않고 이슈로 알린다.
#
#  멈추려면 셋 중 아무거나:
#    - 저장소 Variables 에 THREADS_PAUSED = true
#    - content/threads/PAUSE 파일을 커밋
#    - Actions 탭에서 이 워크플로 Disable

name: 스레드 발행

on:
  schedule:
    # cron 은 UTC 다. 한국시간 = UTC + 9
    - cron: '10 23 * * *'   # 08:10 KST
    - cron: '40 3 * * *'    # 12:40 KST
    - cron: '10 10 * * *'   # 19:10 KST
    - cron: '10 13 * * *'   # 22:10 KST
  workflow_dispatch:
    inputs:
      dry_run:
        description: '올리지 않고 만들어진 글만 본다'
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

# 앞 실행이 아직 돌고 있으면 겹쳐 올리지 않는다
concurrency:
  group: threads-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 발행
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          THREADS_PAUSED: ${{ vars.THREADS_PAUSED }}
          THREADS_MAX_POSTS_PER_DAY: ${{ vars.THREADS_MAX_POSTS_PER_DAY }}
          THREADS_MODEL: ${{ vars.THREADS_MODEL }}
        run: |
          node scripts/threads/publish.mjs ${{ inputs.dry_run && '--dry-run' || '' }}
