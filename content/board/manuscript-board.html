<style>
:root{

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:300;line-height:1.65;-webkit-font-smoothing:antialiased}

.im-top{display:flex;gap:10px;align-items:flex-start}

  width:23px;height:23px;border-radius:50%;display:grid;place-items:center;flex:none;margin-top:1px}
.im-t{font-size:14px;font-weight:500}
.im-note{font-size:12.5px;color:var(--ink2);margin-top:3px;line-height:1.6}
.im-p{font-family:var(--mono);font-size:11.5px;line-height:1.65;color:var(--ink2);background:var(--card2);

.im-act{display:flex;gap:6px;flex-wrap:wrap}
.tagline{font-size:12px;color:var(--ink2);line-height:1.8;word-break:keep-all;background:var(--card);
  border:1px solid var(--line);border-radius:4px;padding:11px 13px}
[hidden]{display:none!important}
.note{margin-top:26px;border-top:1px solid var(--line);padding-top:14px;font-size:12.5px;color:var(--ink3);line-height:1.75}
.note b{color:var(--ink2)}
@media(max-width:560px){ .meta{text-align:left} .btn{font-size:12px;padding:7px 11px} }

마른 솔로 가볍게 털어주세요.\n\n[이미지 4] 막힌 것 없이 열려 있는 보일러실 환기구\n\n인용구(소제목) 일산화탄소 경보기, 우리 집엔 있을까\n\n일산화탄소는 색도 냄새도 없어서\n사람이 알아채기 어려워요.\n그래서 일산화탄소 경보기가 필요해요.\n\n2020년 8월부터는 가스보일러를 새로 설치할 때\n일산화탄소 경보기를 함께 달도록 바뀌었어요.\n[노란배경]그 전에 설치한 보일러라면\n일산화탄소 경보기가 없을 수 있으니 확인해 보세요.[/노란배경]\n\n있다면 버튼을 눌러 소리가 나는지,\n전지형이라면 전지가 남아 있는지도 함께 보세요.\n다는 위치는 제품 설명서가 안내하는 곳을 따르세요.\n\n[이미지 5] 보일러실 벽에 달린 일산화탄소 경보기\n\n인용구(소제목) 켠 뒤에도 보일러 점검은 이어져요\n\n켜고 나서 연기나 불꽃이 보이거나,\n표시등이 깜박이며 켜지지 않거나,\n평소와 다른 소리나 냄새가 난다면\n바로 전원을 끄고 점검을 받으세요.\n\n가스 냄새가 난다면 창문을 열고\n전기 스위치는 건드리지 않은 채\n가스 밸브를 잠그고 가스 공급사에 연락하세요.\n\n처음 켜면 먼지 타는 냄새가 잠깐 날 수 있어요.\n금방 사라지면 괜찮지만\n계속된다면 점검을 받는 쪽이 안전해요.\n\n방마다 바닥이 고르게 따뜻해지는지도 느껴보세요.\n한 방만 계속 차갑다면 배관 쪽 문제일 수 있어\n업체에 문의해 보시면 돼요.\n\n[이미지 6] 보일러 조작부 표시등을 살펴보는 모습\n\n인용구(소제목) 보일러 점검 체크포인트\n\n첫째, 배기통이 처지거나 꺾이지 않았는지 봐요.\n둘째, 배기통 이음새가 헐겁지 않은지 확인해요.\n셋째, 보일러실 환기구가 막혀 있지 않은지 봐요.\n\n넷째, 일산화탄소 경보기가 달려 있고 작동하는지,\n다섯째, 켠 뒤 소리와 냄새가 평소와 같은지 봐요.\n\n[이미지 7] 체크리스트 메모를 들고 보일러를 보는 모습\n\n인용구(소제목) 많이 물어보시는 것들\n\n보일러 점검을 꼭 기사님께 맡겨야 하는지 물으시는데\n오늘 말씀드린 건 눈으로 보고 확인하는 수준이에요.\n헐겁거나 이상한 게 보이면 그때 부르시면 돼요.\n\n아파트라서 괜찮겠지 하시는 분도 많아요.\n보일러실 구조는 집마다 달라서\n세대마다 한 번씩 보는 게 좋아요.\n\n보일러 점검은 언제 하는 게 좋은지도 궁금해하세요.\n난방을 처음 켜기 전인 이맘때가 좋아요.\n한겨울에 문제가 생기면 수리 예약을\n한참 기다려야 할 수도 있거든요.\n\n[이미지 8] 아파트 베란다와 보일러실 전경\n\n인용구(소제목) 오늘 정리하면\n\n[빨간글씨]배기통 이음새, 보일러실 환기구,\n일산화탄소 경보기 세 가지를 켜기 전에 확인하세요.[/빨간글씨]\n\n[이미지 9] 따뜻한 조명 아래 거실 바닥에 앉은 가족\n\n동생은 그날 상자를 치우고\n일산화탄소 경보기를 하나 달았어요.\n관리실에도 배기통을 한 번 봐달라고 부탁했고요.\n첫 난방을 켜면서 괜히 마음이 놓인다고 하더라구요.\n\n보일러 점검은 한 해에 한 번,\n찬바람 불 때 오 분이면 끝나요.\n보일러 기종마다 다를 수 있으니\n설명서도 한 번 함께 확인해 주세요.\n\n[이미지 10] 보일러 리모컨으로 난방을 켜는 손\n\n이 글은 한국가스안전공사의 가스보일러 안전수칙을\n2026년 9월 29일 기준으로 정리했습니다.\n좋아요·공감과 이웃추가 부탁드려요💙\n이상 성글벙글의 난방 준비 포스팅이었습니다😎", "images": [{"t": "베란다 보일러실 문 열어둔 모습 (썸네일)", "n": "한국 아파트 베란다 보일러실. 브랜드 로고 안 보이게.", "p": "An open door of a small utility room on a Korean apartment balcony revealing a white wall-mounted gas boiler with exhaust pipe, clean and tidy, natural daylight, photorealistic interior photography, eye level, 4:3, no logos, no text"}, <script>

const tidy = t => t

  return esc(tidy(t))

}

/* 네이버 에디터에 붙여넣을 HTML. 인라인 style 이라야 서식이 살아서 들어간다.
   tidy() 는 화면 표시용이다. 여기서 쓰면 인용구·이미지 줄이 앞 문단에 붙어버린다. */
function toNaverHtml(t, keepImg){
  const parts = [];

    }
    if (first.startsWith("인용구(소제목)")) {
      // 네이버는 blockquote 를 자기 인용구 컴포넌트로 바꾼다(확인함).
      // 따옴표 장식과 정렬은 에디터가 직접 그리므로 여기서 넣으면 중복된다.
      // 인용구 종류(4번)는 붙여넣기로 지정할 수 없어 에디터에서 골라야 한다.
      const qt = esc(first.replace(/^인용구\(소제목\)\s*/, ""));
      parts.push(`<blockquote><p style="${BASE}">${qt}</p></blockquote>`);
      continue;
    }
    // 줄마다 별도 <p> 로 내보낸다.
    // <br> 은 네이버가 버려서 여러 줄이 한 줄로 뭉친다(확인함).
    // 문단의 기본 글자색도 반드시 명시한다. 없으면 앞 문단의 빨간색을
    // 그대로 상속해 본문 전체가 빨갛게 붙여넣어진다.
    const pieces = [];
    let carry = null;
    for (const line of lines) {
      const opens  = [...line.matchAll(/\[(빨간글씨|파란글씨|노란배경)\]/g)];
      const closes = [...line.matchAll(/\[\/(빨간글씨|파란글씨|노란배경)\]/g)];
      const applied = opens.length ? opens[0][1] : carry;
      if (opens.length && !closes.length) carry = opens[opens.length - 1][1];
      else if (closes.length) carry = null;

      const txt = esc(line.replace(/\[\/?(빨간글씨|파란글씨|노란배경)\]/g, "").trim());
      if (!txt) continue;
      pieces.push(
        applied === "빨간글씨" ? `<span style="color:${RED};font-weight:bold;">${txt}</span>` :
        applied === "파란글씨" ? `<span style="color:${BLUE};font-weight:bold;">${txt}</span>` :
        applied === "노란배경" ? `<span style="color:${INK};background-color:${YEL};font-weight:bold;">${txt}</span>` :
        txt);
    }
    for (const piece of pieces) parts.push(`<p style="${BASE}">${piece}</p>`);
    // 덩어리 사이 빈 줄
    if (pieces.length) parts.push(`<p style="${BASE}"><br></p>`);
  }
  while (parts.length && /^<p[^>]*><br><\/p>$/.test(parts[parts.length - 1])) parts.pop();
  return parts.join("\n");
}

/* 서식 없이 텍스트만 */
function toPlain(t, keepImg){
  return tidy(t).split("\n")
    .filter(l => keepImg || !/^\[이미지\s*\d+\]/.test(l.trim()))
    .map(l => l.replace(/^인용구\(소제목\)\s*/, "").replace(/\[\/?(빨간글씨|파란글씨|노란배경)\]/g, ""))
    .join("\n").replace(/\n{3,}/g, "\n\n").trim();
}

function flash(btn, msg){
  const was = btn.dataset.label || btn.textContent;
  btn.dataset.label = was;
  btn.textContent = msg || "복사됐어요";
  btn.classList.add("ok");
  setTimeout(() => { btn.textContent = was; btn.classList.remove("ok"); }, 1600);
}

async function copyRich(html, plain, btn){
  let done = false;
  try {
    if (window.ClipboardItem && navigator.clipboard && navigator.clipboard.write) {
      await navigator.clipboard.write([new ClipboardItem({
        "text/html":  new Blob([html],  {type: "text/html"}),
        "text/plain": new Blob([plain], {type: "text/plain"}),
      })]);
      done = true;
    }
  } catch { /* 아래 방식으로 다시 시도 */ }
  if (!done) {
    // 보이지 않는 편집영역을 선택해 복사하면 서식이 함께 실린다
    const d = document.createElement("div");
    d.contentEditable = "true";
    d.innerHTML = html;
    d.style.cssText = "position:fixed;left:-9999px;top:0;white-space:pre-wrap;";
    document.body.appendChild(d);
    const r = document.createRange(); r.selectNodeContents(d);
    const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
    try { document.execCommand("copy"); } catch {}
    sel.removeAllRanges(); d.remove();
  }
  flash(btn);
}

async function copyText(text, btn){
  try { await navigator.clipboard.writeText(text); }
  catch {
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.cssText = "position:fixed;left:-9999px";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch {}
    ta.remove();
  }
  flash(btn);
}

function render(){
  const p = S[0];
  document.getElementById("meta").innerHTML =
    `오늘 <b>${S.filter(x=>x.status==="done").length} / ${S.length}</b> 완료<br>10월 1일 (목) 발행분`;

  document.getElementById("list").innerHTML = S.map((p,i) => { const has = !!(p.body && p.body.trim()); return `
   <article class="card ${p.status}">
    <div class="chead">
      <div>
        ${p.date ? `<div class="kv" style="margin:0 0 4px"><span><b>${esc(p.date)}</b></span><span>${esc(p.type||"")}</span><span>${esc(p.note||"")}</span></div>` : ""}
        <h2 class="ctitle">${esc(p.title)}</h2>
        ${has ? "" : `<div class="kv"><span>원고 작성 전</span></div>`}
        <div class="kv" ${has ? "" : "hidden"}>
          <span>메인 <b>${esc(p.main)}</b> ${p.mainN}회</span>
          <span>검색량 <b>${esc(p.vol)}</b></span>
          <span>본문 <b>${p.chars}자</b> (공백 포함)</span>
        </div>
        <div class="kv" ${has ? "" : "hidden"}><span>서브 <code>${p.subs.map(esc).join(" · ")}</code></span></div>
      </div>
      <button class="pill ${p.status}" data-act="cycle" data-i="${i}">${LABEL[p.status]}</button>
    </div>
    <div class="actions" ${has ? "" : "hidden"}>
      <button class="btn pri" data-act="copy-rich" data-i="${i}">네이버용 서식 복사</button>
      <button class="btn" data-act="copy-plain" data-i="${i}">텍스트만 복사</button>
      <button class="btn" data-act="copy-tags" data-i="${i}">태그 복사</button>
      <button class="btn" data-act="toggle" data-i="${i}" data-t="ms">원고 보기</button>
      <button class="btn" data-act="toggle" data-i="${i}" data-t="img">이미지 프롬프트 ${p.images.length}장</button>
    </div>
    <p class="hint" ${has ? "" : "hidden"}>빨간·파란 글씨와 연한 노란 형광펜이 그대로 들어가요. 소제목은 인용구로 바뀌는데, 종류(4번)는 붙여넣은 뒤 에디터에서 골라주세요.</p>

    <div class="panel" id="ms${i}" hidden>
      <p class="ptitle">원고 전문</p>
      <pre class="ms">${paint(p.body)}</pre>
    </div>

    <div class="panel" id="img${i}" hidden>
      <p class="ptitle">이미지 프롬프트 — 한 장씩 복사해서 쓰세요</p>
      ${p.images.map((im,j) => `
        <div class="im-item">
          <div class="im-top">
            <span class="im-n">${j+1}</span>
            <div style="flex:1">
              <div class="im-t">${esc(im.t)}</div>
              <div class="im-note">${esc(im.n)}</div>
            </div>
          </div>
          <div class="im-p">${esc(im.p)}</div>
          <div class="im-act">
            <button class="btn" data-act="copy-prompt" data-i="${i}" data-j="${j}">프롬프트 복사</button>
          </div>
        </div>`).join("")}
      <p class="ptitle" style="margin-top:16px">해시태그 15개</p>
      <div class="tagline">${esc(p.tags)}</div>
    </div>
   </article>`; }).join("");
}

let saving = false;
async function save(){
  if (saving) return;
  saving = true;
  try {
    const api = await claude.use("artifact");
    if (!api) return;
    await api.publish(PRISTINE.replace(/(<script id="state"[^>]*>)[\s\S]*?(<\/script>)/,
      (m,a,b) => a + JSON.stringify(S).replace(/<\//g, "<\\/") + b));
  } catch { /* conflict 면 모든 창이 최신본으로 새로고침된다 */ }
  finally { saving = false; }
}

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b) return;
  const p = S[+b.dataset.i];
  switch (b.dataset.act) {
    case "cycle": p.status = NEXT[p.status]; render(); save(); break;
    case "toggle": {
      const el = document.getElementById(b.dataset.t + b.dataset.i);
      el.hidden = !el.hidden;
      b.textContent = el.hidden ? (b.dataset.t === "ms" ? "원고 보기" : `이미지 프롬프트 ${p.images.length}장`) : "접기";
      break;
    }
    case "copy-rich":   copyRich(toNaverHtml(p.body, true), toPlain(p.body, true), b); break;
    case "copy-plain":  copyText(toPlain(p.body, true), b); break;
    case "copy-tags":   copyText(p.tags, b); break;
    case "copy-prompt": copyText(p.images[+b.dataset.j].p, b); break;
  }
});

render();
</script>
