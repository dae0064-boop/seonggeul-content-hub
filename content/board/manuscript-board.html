  "body": "작년 이맘때 딱 5분 아꼈다가\n올해 6월에 반나절을 썼어요.\n\n[이미지 1] 커버 씌워둔 에어컨 전체 컷 (썸네일용)\n\n인용구(소제목) 작년 가을에 있었던 일\n\n작년 9월, 선선해지길래\n에어컨 리모컨을 내려놨어요.\n\n먼지 쌓일까 싶어서\n비닐 커버만 씌워뒀거든요.\n\n그리고 올해 6월,\n더워서 켰는데\n쿰쿰한 냄새가 확 올라오더라구요.\n\n에어컨 필터를 빼봤더니\n까맣게 곰팡이가 피어 있었어요.\n\n결국 업체를 불렀습니다.\n\n[이미지 2] 곰팡이 낀 필터 근접 컷 (비포)\n\n인용구(소제목) 원인은 에어컨 청소가 아니었어요\n\n여기서 결론부터 말씀드릴게요.\n\n[빨간글씨]문제는 에어컨 청소를\n안 해서가 아니었어요.\n말리지 않고 덮어서였습니다.[/빨간글씨]\n\n순서가 틀렸던 거예요.\n\n인용구(소제목) 왜 말리는 게 먼저일까요\n\n여름 내내 찬 바람을 만든\n에어컨 안쪽에는 물기가 맺혀요.\n\n컵에 찬물을 따라두면\n겉에 물방울이 생기잖아요.\n그것과 같은 원리예요.\n\n[노란배경]그 물기를 그대로 두고\n덮으면 습기가 갇혀요.[/노란배경]\n\n거기에 먼지까지 있으면\n곰팡이가 자라기 좋은 조건이 돼요.\n\n그래서 에어컨 청소는\n쓰고 난 직후인 지금이 좋아요.\n\n봄으로 미루면 이미 자란 곰팡이를\n걷어내는 일이 되더라구요.\n\n인용구(소제목) 미루면 생기는 다른 문제들\n\n곰팡이 냄새만 문제가 아니더라구요.\n\n필터에 먼지가 쌓이면\n바람이 잘 안 나와요.\n\n같은 온도로 맞춰놔도\n더 오래 돌려야 하니까\n전기요금이 올라가요.\n\n[노란배경]에어컨 청소를 미루면\n결국 돈으로 돌아와요.[/노란배경]\n\n알레르기가 있으시다면\n더 신경 쓰셔야 해요.\n\n에어컨 바람에 곰팡이 포자가\n같이 실려 나오니까요.\n\n인용구(소제목) 언제 하는 게 좋을까요\n\n냉방을 마지막으로 쓰고\n일주일 안에 하시는 게 좋아요.\n\n속에 물기가 남아 있을 때\n말려야 효과가 있거든요.\n\n[노란배경]9월 중순에서 10월 초,\n이때가 딱 좋더라구요.[/노란배경]\n\n너무 늦으면 이미 곰팡이가\n자란 뒤라서\n에어컨 청소가 두 배로 힘들어져요.\n\n[이미지 3] 송풍 모드 켜진 리모컨 화면\n\n인용구(소제목) 에어컨 청소 순서 네 단계\n\n1단계는 송풍으로 속 말리기예요.\n\n냉방을 끄고 바람만 도는 모드로\n충분히 돌려주세요.\n\n리모컨에 건조나 클린 표시가\n있으면 그걸 쓰셔도 돼요.\n\n[이미지 4] 앞판 열어 필터 빼내는 장면\n\n2단계는 에어컨 필터 씻기예요.\n\n앞판을 열면 그물망처럼 생긴\n판이 걸려 있어요.\n\n먼지를 털어내고\n미지근한 물로 헹구면 됩니다.\n\n세제는 안 써도 되고,\n뜨거운 물은 피해주세요.\n필터가 휘어질 수 있거든요.\n\n[이미지 5] 물에 헹구는 필터 (애프터)\n\n3단계는 겉면 닦기예요.\n\n마른 걸레로 먼지를 걷어낸 뒤\n물기 짠 걸레로 한 번 더 닦아요.\n\n바람 나오는 날개 쪽에\n먼지가 잘 껴 있더라구요.\n\n[이미지 6] 그늘에서 말리는 필터\n\n4단계는 전원 뽑고 덮기예요.\n\n에어컨 필터까지 마른 걸\n확인한 다음에 덮어주세요.\n\n플러그를 뽑아두면\n겨울 내내 조금씩 나가는\n대기전력도 같이 줄어요.\n\n덮기 전에 리모컨 건전지도\n빼두시면 좋아요.\n\n인용구(소제목) 이건 되고, 이건 안 돼요\n\n되는 경우부터 볼게요.\n\n[노란배경]송풍으로 말린 뒤\n천으로 된 에어컨 커버를 씌우기.[/노란배경]\n\n먼지는 막고 습기는 빠져나가요.\n에어컨 커버가 없으시면\n얇은 이불보도 괜찮아요.\n\n안 되는 경우는 이거예요.\n\n[노란배경]젖은 상태에서\n비닐 에어컨 커버로 꽉 덮기.[/노란배경]\n\n제가 작년에 한 게 이거예요.\n습기가 갇혀서 곰팡이가 자라요.\n\n실외기 커버도 마찬가지예요.\n\n밀폐형 실외기 커버로 감싸면\n안에 습기가 갇히거든요.\n\n실외기는 원래 비바람을\n맞도록 만들어진 물건이에요.\n\n한 가지 더 있어요.\n\n벽걸이형은 커버를 씌우기\n애매한 경우가 많더라구요.\n\n억지로 씌우기보다\n위쪽 먼지만 주기적으로\n털어주셔도 충분해요.\n\n스탠드형은 위에서 아래로\n덮는 형태라 훨씬 수월해요.\n\n[이미지 7] 천 커버 vs 비닐 커버 비교 컷\n\n인용구(소제목) 덮기 전에 확인할 것\n\n내 에어컨에서 이것만\n체크해보세요.\n\n▪ 필터가 속까지 말랐는지\n겉만 만져보면 속아요\n\n▪ 에어컨 커버 소재가\n비닐인지 천인지\n\n▪ 플러그를 뽑았는지\n대기전력도 같이 줄어요\n\n▪ 실외기 위에\n낙엽이나 물건이 없는지\n\n▪ 리모컨 건전지를 뺐는지\n오래 두면 액이 새더라구요\n\n[이미지 8] 체크리스트 5줄 카드 이미지\n\n인용구(소제목) 많이 묻는 것들\n\nQ. 에어컨 필터만 씻어도 되나요?\n\n에어컨 필터는 직접 하실 수 있어요.\n\n다만 안쪽 열교환기나 송풍팬은\n분해해야 손이 닿아요.\n\n냄새가 심하면 전문 에어컨 청소를\n부르시는 게 안전해요.\n\nQ. 에어컨 커버 꼭 씌워야 하나요?\n\n안 씌워도 큰일 나진 않아요.\n먼지 관리 차원이에요.\n\n씌우신다면 소재만\n천으로 골라주세요.\n\n사이즈가 맞지 않아도\n괜찮아요. 먼지만 막으면 되니까\n넉넉한 쪽이 오히려 나아요.\n\nQ. 실외기 커버는 어떻게 하나요?\n\n실외기 커버는 안 씌우시는 걸\n권해드려요.\n\n밀폐하면 오히려 습기가 갇혀요.\n윗면 낙엽만 치워주시면 돼요.\n\nQ. 에어컨 청소는\n몇 년에 한 번 하나요?\n\n필터 관리를 평소에 해두시면\n전문 청소 주기는 길어져요.\n\n냄새나 곰팡이가 보일 때가\n부르실 때예요.\n\nQ. 내년 봄엔 뭘 하면 되나요?\n\n에어컨 커버 걷고 바로 켜지 마시고,\n창문 열고 송풍부터 돌려주세요.\n\n안쪽 공기를 빼낸 다음\n냉방으로 바꾸면\n첫 바람부터 깨끗해요.\n\n[이미지 9] Q&A 요약 카드 이미지\n\n인용구(소제목) 정리하면\n\n[빨간글씨]송풍으로 말리기 →\n에어컨 필터 세척 후 완전 건조 →\n겉면 닦기 →\n전원 뽑고 천 커버 →\n실외기 커버는 씌우지 않기[/빨간글씨]\n\n올해는 순서대로 해봤어요.\n\n작년처럼 반나절 걸리지 않고\n한 시간이면 끝나더라구요.\n\n내년 6월에 켰을 때\n냄새 없이 시원한 바람이 나오면\n오늘 들인 한 시간은\n충분히 값을 하는 셈이에요.\n\n에어컨 청소, 오늘 끝내보세요.\n\n[이미지 10] 정리 끝난 에어컨 + 천 커버 (애프터)",

<div class="wrap">
  <header>
    <div class="htop">
      <div>
        <h1>원고 작업판</h1>
        <p class="sub">오늘 쓸 5개. 상태를 눌러 미완료 → 작성중 → 완료로 바꾸면 저장돼요.</p>
      </div>
      <div class="meta" id="meta"></div>
    </div>
    <div class="bar" id="bar"></div>
    <div class="tally">
      <span><i class="sw" style="background:var(--todo)"></i>미완료</span>
      <span><i class="sw" style="background:var(--doing)"></i>작성중</span>
      <span><i class="sw" style="background:var(--done)"></i>작성완료</span>
    </div>
  </header>

  <main id="list"></main>

  <p class="note">클러스터 = 여름·가을 전환 살림. 5개를 서로 링크하면 한 덩어리가 됩니다.<br>
  원고에 <b>[이미지 N]</b> 자리를 표시해 뒀어요. 사진을 넣은 뒤 그 줄은 지우시면 됩니다.</p>
</div>

<script>
const PRISTINE = "<!doctype html>\n" + document.documentElement.outerHTML;
const S = JSON.parse(document.getElementById("state").textContent);
const NEXT = {todo:"doing", doing:"done", done:"todo"};
const LABEL = {todo:"미완료", doing:"작성중", done:"작성완료"};
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* 인용구·이미지 줄은 CSS 여백이 따로 있으므로 앞뒤 빈 줄을 겹치지 않게 정리한다. */
const tidy = t => t
  .replace(/\n{2,}(?=\[이미지)/g, "\n")
  .replace(/(^\[이미지.*$)\n{2,}/gm, "$1\n")
  .replace(/\n{2,}(?=인용구\(소제목\))/g, "\n")
  .replace(/(^인용구\(소제목\).*$)\n{2,}/gm, "$1\n");

/* 원고를 화면용으로 칠한다. 원본 텍스트는 건드리지 않는다. */
function paint(t){
  return esc(tidy(t))
    .replace(/^\[이미지\s*(\d+)\]\s*(.*)$/gm, '<span class="im">📷 이미지 $1 — $2</span>')
    .replace(/^인용구\(소제목\)\s*(.*)$/gm, '<span class="qt">$1</span>')
    .replace(/\[빨간글씨\]([\s\S]*?)\[\/빨간글씨\]/g, '<span class="rd">$1</span>')
    .replace(/\[노란배경\]([\s\S]*?)\[\/노란배경\]/g, '<span class="yl">$1</span>');
}
const stripImages = t => t.split("\n").filter(l => !/^\[이미지\s*\d+\]/.test(l.trim())).join("\n").replace(/\n{3,}/g,"\n\n");

async function copy(text, btn){
  try { await navigator.clipboard.writeText(text); }
  catch { const ta=document.createElement("textarea"); ta.value=text; document.body.appendChild(ta); ta.select();
          try{document.execCommand("copy");}catch{} ta.remove(); }
  const was = btn.textContent;
  btn.textContent = "복사됨"; btn.classList.add("ok");
  setTimeout(()=>{ btn.textContent = was; btn.classList.remove("ok"); }, 1500);
}

function render(){
  const n = {todo:0, doing:0, done:0};
  S.forEach(p => n[p.status]++);
  document.getElementById("meta").innerHTML =
    `작성완료 <b>${n.done} / ${S.length}</b><br>클러스터 <b>여름·가을 전환 살림</b>`;
  document.getElementById("bar").innerHTML = ["done","doing","todo"]
    .map(k => `<i style="width:${n[k]/S.length*100}%;background:var(--${k})"></i>`).join("");

  document.getElementById("list").innerHTML = S.map((p,i) => `
   <article class="card ${p.status}">
    <div class="chead">
      <span class="idx">${String(i+1).padStart(2,"0")}</span>
      <div>
        <h2 class="ctitle">${esc(p.title)}</h2>
        <div class="kv">
          <span>메인 <b>${esc(p.main)}</b></span>
          <span>검색량 <b>${esc(p.vol)}</b></span>
          ${p.chars ? `<span>본문 <b>${p.chars}자</b></span><span>키워드 <b>${p.mainN}회</b></span>` : ""}
        </div>
        <div class="kv"><span>서브 <code>${p.subs.map(esc).join(" · ")}</code></span></div>
      </div>
      <button class="pill ${p.status}" data-act="cycle" data-i="${i}">${LABEL[p.status]}</button>
    </div>
    <div class="actions">
      ${p.body ? `
       <button class="btn" data-act="toggle" data-i="${i}" data-t="ms">원고 보기</button>
       <button class="btn" data-act="copy-clean" data-i="${i}">본문만 복사</button>
       <button class="btn" data-act="copy-full" data-i="${i}">이미지 표시 포함 복사</button>` : ""}
      <button class="btn" data-act="toggle" data-i="${i}" data-t="img">이미지 10장 스크립트</button>
      ${p.tags ? `<button class="btn" data-act="copy-tags" data-i="${i}">태그 복사</button>` : ""}
    </div>
    ${p.body ? `<div class="panel" id="ms${i}" hidden>
      <p class="ptitle">원고 전문</p><pre class="ms">${paint(p.body)}</pre></div>` : ""}
    ${!p.body && p.outline ? `<div class="panel"><p class="ptitle">구성안</p>
      <ul class="ol">${p.outline.map(o=>`<li>${esc(o)}</li>`).join("")}</ul></div>` : ""}
    <div class="panel" id="img${i}" hidden>
      <p class="ptitle">이미지 10장 촬영 스크립트</p>
      <ol class="imgs">${p.images.map(im => typeof im === "string"
        ? `<li><div><div class="it">${esc(im)}</div></div></li>`
        : `<li><div><div class="it">${esc(im.t)}</div><div class="is">${esc(im.s)}</div></div></li>`).join("")}</ol>
      ${p.tags ? `<p class="tagline"><b>태그</b> ${esc(p.tags)}</p>` : ""}
    </div>
   </article>`).join("");
}

let saving = false;
async function save(){
  if (saving) return;
  saving = true;
  try {
    const api = await claude.use("artifact");
    if (!api) return;
    const doc = PRISTINE.replace(/(<script id="state"[^>]*>)[\s\S]*?(<\/script>)/,
      (m,a,b) => a + JSON.stringify(S).replace(/<\//g,"<\\/") + b);
    await api.publish(doc);
  } catch (e) { /* conflict 는 모든 창이 최신본으로 새로고침되므로 재시도하지 않는다 */ }
  finally { saving = false; }
}

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b) return;
  const i = +b.dataset.i, p = S[i];
  switch (b.dataset.act) {
    case "cycle":      p.status = NEXT[p.status]; render(); save(); break;
    case "toggle": {
      const el = document.getElementById(b.dataset.t + i);
      el.hidden = !el.hidden;
      b.textContent = el.hidden
        ? (b.dataset.t === "ms" ? "원고 보기" : "이미지 10장 스크립트")
        : "접기";
      break;
    }
    case "copy-clean": copy(stripImages(p.body), b); break;
    case "copy-full":  copy(p.body, b); break;
    case "copy-tags":  copy(p.tags, b); break;
  }
});

render();
</script>
