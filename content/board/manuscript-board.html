<style>

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:300;line-height:1.65;-webkit-font-smoothing:antialiased}

[hidden]{display:none!important}
.note{margin-top:26px;border-top:1px solid var(--line);padding-top:14px;font-size:12.5px;color:var(--ink3);line-height:1.75}

<script id="state" type="application/json">[{"status":"doing","date":"10/03 작성","type":"검색유입형","note":"맛집 · 직접 찍은 사진 5장","title":"인천 논현동 맛집 전주명가 순두부찌개 오징어볶음","main":"인천 논현동 맛집","mainN":10,"vol":"미확인","chars":1732,"subs":["전주명가","순두부찌개","오징어볶음"],"body":"안녕하세요\n매일매일 좋은 날을 나누는 성글벙글입니다😊\n\n오늘은 인천 논현동 맛집 전주명가\n포스팅 내용에 대해\n설명드리겠습니다.\n\n[파란글씨]결론부터 말씀드리면,\n인천 논현동 맛집을 찾는다면\n전주명가 순두부찌개와 오징어볶음\n조합을 추천해요.[/파란글씨]\n\n[이미지 1] 가게 외관\n\n인용구(소제목) 인천 논현동 맛집 전주명가, 찾아가는 길\n\n아침저녁으로 쌀쌀해지니\n뜨끈한 국물이 자꾸 생각나더라고요.\n그래서 인천논현역 근처에 있는\n전주명가에 다녀왔어요.\n\n전주명가는 상가 1층에 있고\n큼직한 간판에 '해장국 매운갈비찜\n전문점, 논현본점'이라고 적혀 있어요.\n멀리서도 한눈에 찾을 수 있었어요.\n\n입구가 통유리문이라 안이 잘 보여서\n처음 가는 분도 부담이 없어요.\n창가에 메뉴와 가격이 붙어 있어\n들어가기 전에 미리 볼 수 있어요.\n\n주소:\n영업시간:\n연락처:\n주차:\n\n[이미지 2] 매장 내부\n\n인용구(소제목) 인천 논현동 맛집 전주명가 매장 분위기\n\n안으로 들어가니 나무 테이블이\n넉넉하게 놓여 있었어요.\n바닥까지 깔끔하게 관리되어 있고\n벽 쪽에는 소파 좌석도 있어요.\n\n테이블마다 화구가 있어서\n전골이나 갈비찜도\n자리에서 끓여 먹을 수 있어요.\n물컵도 테이블마다 준비되어 있어요.\n\n혼자 한 그릇 먹기에도,\n가족이나 직장 동료와 오기에도\n무난한 분위기였어요.\n벽에는 '선지국의 효능' 안내도 있어요.\n\n[이미지 3] 메뉴판\n\n인용구(소제목) 인천 논현동 맛집 전주명가 메뉴와 가격\n\n메뉴판을 보니 식사 메뉴가 다양했어요.\n[파란글씨]순두부찌개와 통돼지 김치찌개는\n8,000원이에요.[/파란글씨]\n선지해장국과 육개장은 9,000원이에요.\n\n[파란글씨]오징어볶음과 제육볶음은\n10,000원이에요.[/파란글씨]\n소갈비해장국과 뚝배기 불고기는\n11,000원이에요.\n\n대표 메뉴인 매운양푼소갈비찜은\n小(2인) 45,000원,\n中(3~4인) 69,000원,\n大(4~5인) 95,000원이에요.\n\n[빨간글씨]김치전골과 오삼불고기는\n2인 이상부터 주문할 수 있어요.[/빨간글씨]\n가격은 각각 20,000원이에요.\n\n한 끼가 8,000~10,000원대라\n인천 논현동 맛집 중에서도\n부담이 적은 편이었어요.\n[빨간글씨]다만 가격은 방문 시점 기준이라\n바뀔 수 있어요.[/빨간글씨]\n\n[이미지 4] 조미료 무첨가 안내문\n\n벽에는 이런 안내문이 걸려 있었어요.\n[노란배경]전주명가는 모든 메뉴를\n직접 만들어 끓이고\n화학조미료와 MSG, 방부제를\n넣지 않는다고 적혀 있어요.[/노란배경]\n\n자주 먹는 밥일수록\n이런 점이 더 믿음이 가더라고요.\n\n[이미지 5] 순두부찌개와 오징어볶음 한 상\n\n인용구(소제목) 순두부찌개와 오징어볶음, 직접 먹어보니\n\n주문한 메뉴는\n순두부찌개와 오징어볶음이에요.\n밑반찬은 배추김치, 오이무침,\n가지무침, 미역줄기볶음이 나왔어요.\n\n하나같이 집밥처럼 정갈했어요.\n인천 논현동 맛집에서\n이런 반찬을 만나니 반가웠어요.\n특히 미역줄기볶음에 손이 자주 갔어요.\n\n먼저 순두부찌개는 뚝배기에 담겨\n보글보글 끓는 채로 나왔어요.\n두부와 애호박, 김치가 들어 있어\n국물이 칼칼하고 시원했어요.\n\n몽글몽글한 순두부가 넉넉해서\n밥에 올려 먹기 좋았어요.\n[노란배경]국물은 얼큰하면서도\n자극적이지 않아 속이 편안했어요.[/노란배경]\n\n다음은 오징어볶음이에요.\n빨간 양념에 오징어와 양배추, 양파,\n대파가 푸짐하게 볶아져 나왔어요.\n위에는 깨가 솔솔 뿌려져 있었어요.\n\n오징어가 질기지 않고 탱글해서\n씹는 맛이 좋았어요.\n매콤달콤한 양념은\n밥에 쓱쓱 비벼 먹기 딱 좋았어요.\n\n[파란글씨]오징어볶음 한 입에\n순두부찌개 국물 한 숟갈을 곁들이면\n두 메뉴 궁합이 잘 맞아요.[/파란글씨]\n\n인용구(소제목) 인천 논현동 맛집 전주명가, 이런 분께 추천해요\n\n[노란배경]전주명가는 조미료 없는 집밥 같은\n한식을 8,000~10,000원대에\n먹을 수 있는 곳이에요.[/노란배경]\n\n논현동에서 든든한 점심을 찾는 분,\n얼큰한 찌개와 매콤한 볶음을\n같이 먹고 싶은 분,\n집밥 같은 한식을 좋아하는 분께 맞아요.\n\n[파란글씨]둘이 간다면 찌개 하나와 볶음 하나를\n시켜 나눠 먹는 조합을 추천해요.[/파란글씨]\n해장국과 매운갈비찜도 궁금해서\n다음에는 선지해장국을 먹어보려고요.\n\n인천 논현동 맛집을 찾고 계신다면\n쌀쌀한 날 전주명가에서\n뜨끈한 한 끼 드셔보세요.\n\n좋아요·공감과 이웃추가 부탁드려요💙\n이상 성글벙글의 인천 논현동 맛집 포스팅이었습니다😎","images":[{"t":"가게 외관","n":"직접 찍은 사진 · 첫 소제목 위","p":"KakaoTalk_20260901_125750984.jpg"},{"t":"매장 내부","n":"직접 찍은 사진 · 매장 분위기 소제목 위","p":"KakaoTalk_20260901_125750984_05.jpg"},{"t":"메뉴판","n":"직접 찍은 사진 · 와이파이 비밀번호가 보이니 잘라서 올리기","p":"KakaoTalk_20260901_125750984_08.jpg"},{"t":"조미료 무첨가 안내문","n":"직접 찍은 사진 · 메뉴 설명 뒤","p":"KakaoTalk_20260901_125750984_07.jpg"},{"t":"순두부찌개와 오징어볶음 한 상","n":"직접 찍은 사진 · 대표사진 추천, 오른쪽 위 팔은 잘라내기","p":"KakaoTalk_20260901_125750984_03.jpg"}],"tags":"#인천논현동맛집 #전주명가 #인천논현역맛집 #논현동맛집 #순두부찌개 #오징어볶음 #인천맛집 #남동구맛집 #논현동밥집 #인천논현동밥집 #논현동점심 #인천해장국 #매운갈비찜 #인천한식 #논현동한식 #서이추 #이웃추가 #서이추환영"},{"status":"todo","date":"10/05 작성","type":"방문후기","note":"촬영 후기 · 직접 찍은 사진 8장","title":"전주 사진관 오브제스튜디오, 친구네 부부와 함께 찍은 전주 우정사진 후기","main":"전주 사진관","mainN":10,"vol":"미확인","chars":2739,"subs":["전주 우정사진","전주 커플사진","오브제스튜디오"],"body":"안녕하세요\n매일매일 좋은 날을 나누는 성글벙글입니다😊\n\n오늘은 전주 사진관 오브제스튜디오에서\n저희 부부와 친구네 부부가 함께 찍은\n전주 우정사진 후기를 포스팅으로 남겨 볼게요.\n\n사진관은 혼자나 둘이 가는 곳이라고\n생각하기 쉬운데요, 두 부부가 같이 가니\n커플사진과 우정사진을 한 번에 남길 수 있더라구요.\n\n친구 부부와 함께할 사진관을 찾는 분들께\n저희가 다녀온 그대로 정리해 봤어요.\n궁금하셨다면 이 글을 끝까지 읽어 보세요.\n\n[이미지 1] 오브제스튜디오에서 찍은 두 부부 단체 사진 (대표사진)\n\n인용구(소제목) 전주 사진관, 두 부부가 같이 찾은 이유\n\n[이미지 2] 오브제스튜디오 입구와 간판\n\n친구네 부부와는 오래 알고 지냈는데\n넷이 제대로 찍은 사진이 한 장도 없었어요.\n휴대폰 사진은 늘 누군가 한 명이 빠지거든요.\n여행 사진을 봐도 찍어 준 사람은 없더라구요.\n\n그래서 이번엔 작가님이 찍어 주는\n전주 사진관을 찾아보기로 했어요.\n[노란배경]넷이 모두 나오는 사진 한 장[/노란배경]이 목표였어요.\n\n전주 사진관을 고를 때는 셀프사진관보다\n작가님이 찍어 주는 곳을 골랐어요.\n[파란글씨]4명[/파란글씨]이 리모컨을 들고 자리를 맞추기는\n아무래도 쉽지 않을 것 같았거든요.\n\n인용구(소제목) 오브제스튜디오 전주점 찾아가는 길\n\n[이미지 3] 스튜디오가 있는 건물 외관\n\n오브제스튜디오는 전주 [파란글씨]객사[/파란글씨] 근처에 있어요.\n주소는 [파란글씨]전주객사4길 73-7[/파란글씨]이고\n스튜디오는 건물 [파란글씨]2층[/파란글씨]이에요.\n\n【주소·영업시간·주차 직접 확인 후 이 줄 지우기】\n영업시간은 [파란글씨]11시[/파란글씨]부터 [파란글씨]20시[/파란글씨]까지로 안내돼 있어요.\n객사 주변은 주말에 붐벼서\n[빨간글씨]주차 자리는 미리 알아보고 가시는 게 좋아요.[/빨간글씨]\n\n두 집이 차 한 대로 같이 움직이면\n주차 걱정도 줄고 가는 길도 덜 심심해요.\n촬영 전후로 객사 근처를 걸어도 좋더라구요.\n\n인용구(소제목) 전주 우정사진, 넷이 함께 찍은 컷\n\n[이미지 4] 두 부부가 나란히 선 우정사진\n\n전주 우정사진은 넷이 다 같이 서는 컷부터\n남자끼리, 여자끼리 나눠 찍는 컷까지 찍었어요.\n같은 자리에서도 조합을 바꾸니 느낌이 달랐어요.\n\n처음엔 넷 다 어색해서 웃음만 나왔는데\n작가님이 서는 자리와 시선을 잡아 주셔서\n몇 컷 지나니 표정이 훨씬 편해졌어요.\n\n[노란배경]포즈를 몰라도 작가님이 이끌어 주니[/노란배경]\n사진 찍는 게 익숙하지 않은 분들도\n크게 걱정하지 않으셔도 될 것 같아요.\n\n다만 사진이 잘 나오는지는 작가님만큼\n찍히는 사람의 편한 마음도 중요하더라구요.\n서로 농담을 건네며 찍으니 표정이 확 살았어요.\n\n인용구(소제목) 전주 커플사진, 부부끼리 따로 남긴 컷\n\n[이미지 5] 저희 부부 커플사진\n\n전주 커플사진은 부부마다 따로 찍었어요.\n한 부부가 찍는 동안 다른 부부는\n옆에서 구경하며 웃음을 보태 줬어요.\n\n둘만 있으면 어색했을 텐데\n친구들이 옆에 있으니 오히려 자연스러웠어요.\n이게 두 부부가 같이 간 큰 장점이었어요.\n\n전주 커플사진을 찍을 때는 마주 보는 컷,\n나란히 앉는 컷처럼 자세를 바꿔 가며 찍었어요.\n결혼사진 이후로 둘이 제대로 찍은 건\n정말 오랜만이라 저희도 새삼스러웠어요.\n\n인용구(소제목) 전주 사진관 가기 전에 챙기면 좋은 것\n\n[이미지 6] 촬영 전 옷과 소품을 맞춰 보는 모습\n\n네 사람이 함께 찍는 사진은\n[빨간글씨]옷 색을 미리 맞추지 않으면 산만해 보여요.[/빨간글씨]\n저희는 밝은 색 위주로 톤만 맞춰 갔어요.\n\n옷 말고도 챙기면 좋은 게 몇 가지 있어요.\n\n✔ 옷은 같은 계열 색으로 톤 맞추기\n✔ 찍고 싶은 조합(넷·부부·친구끼리) 미리 정하기\n✔ 예약 시간보다 조금 일찍 도착하기\n\n✔ 머리끈·거울 같은 작은 소지품 챙기기\n✔ 인원이 많으면 촬영 시간 넉넉히 묻기\n\n특히 넷이 찍는 전주 우정사진은\n부부별 커플 컷까지 더하면 컷 수가 늘어나요.\n[노란배경]찍고 싶은 조합을 메모해 가면[/노란배경]\n현장에서 시간을 아낄 수 있어요.\n\n인용구(소제목) 전주 우정사진, 두 부부라면 이렇게 나눠 보세요\n\n넷이 함께 찍을 때는 순서를 미리 정해 두면\n기다리는 시간이 덜 지루해요.\n저희가 다녀와서 느낀 순서를 정리해 봤어요.\n\n먼저 넷이 함께 서는 단체 컷으로 시작해요.\n처음엔 굳어 있어도 다 같이 웃다 보면\n금방 분위기가 풀리더라구요.\n\n그다음 부부별 전주 커플사진을 찍고,\n기다리는 부부는 옆에서 응원을 맡아요.\n마지막엔 남자끼리, 여자끼리 컷으로 마무리해요.\n\n[노란배경]단체 컷을 처음과 끝에 두 번 찍으면[/노란배경]\n풀린 표정의 사진을 하나 더 건질 수 있어요.\n\n인용구(소제목) 오브제스튜디오 사진, 받아 보니 어땠냐면\n\n[이미지 7] 보정을 마친 사진 결과물\n\n【가격·상품 구성·보정 장수·받는 기간 적기】\n사진을 받아 보니 넷의 표정이 다 살아 있어서\n보는 내내 그날 이야기가 다시 나왔어요.\n휴대폰 사진과는 느낌이 꽤 달랐어요.\n\n[노란배경]찍을 땐 어색해도 사진은 오래 남아요.[/노란배경]\n오브제스튜디오 사진은 거실 액자로 걸어 두려고 해요.\n\n친구네 부부도 같은 사진을 받아서\n각자 집에 한 장씩 두기로 했어요.\n같은 순간을 두 집이 나눠 갖는 셈이라\n전주 커플사진보다 더 뿌듯했어요.\n\n인용구(소제목) 전주 사진관 Q&A\n\n[이미지 8] 스튜디오 내부 촬영 공간\n\n전주 사진관 촬영에 많이 묻는 세 가지예요.\n\nQ1: 네 명이 같이 찍어도 되나요?\nA1: 저희는 두 부부 넷이 함께 찍었어요.\n인원과 원하는 구성은 예약할 때\n미리 말씀드리면 준비가 수월해요.\n\nQ2: 전주 우정사진, 어떤 조합으로 찍나요?\nA2: 넷이 함께, 부부끼리, 친구끼리로\n나눠 찍으면 한 번에 여러 사진이 남아요.\n옷 톤만 맞춰도 단체 컷이 훨씬 정돈돼 보여요.\n\nQ3: 전주 커플사진만 따로 찍을 수 있나요?\nA3: 저희는 단체 컷과 커플 컷을 같이 찍었어요.\n커플 컷만 원할 때 구성이 어떻게 되는지는\n상품마다 다를 수 있어 예약 전에 확인해 보세요.\n\n인용구(소제목) 전주 사진관 후기를 마치며\n\n두 부부가 함께 간 전주 사진관 촬영은\n[빨간글씨]둘이 갈 때보다 훨씬 덜 어색했어요.[/빨간글씨]\n전주 우정사진과 전주 커플사진을 한 번에 남겼어요.\n\n여러분은 친구와 마지막으로 같이 찍은 사진이\n언제인지 기억나세요?\n\n[파란글씨]2026년[/파란글씨] 가을, 저희 넷의 사진은 이렇게 남았어요.\n전주 사진관을 찾고 계신다면\n친구와 함께 가는 것도 생각해 보세요.\n\n오래 알고 지낸 친구가 있다면\n[빨간글씨]오브제스튜디오에서 함께 한 장 남겨 보세요.[/빨간글씨]\n\n오늘 후기는 저희가 직접 다녀와서 느낀 그대로예요.\n사진 취향은 사람마다 달라서\n작가님 사진 분위기를 먼저 보고 고르시면 좋아요.\n\n가격과 상품 구성은 바뀔 수 있으니 예약 전에\n스튜디오에 한 번 더 확인해 주세요.\n(2026년 10월 기준)\n\n좋아요·공감과 이웃추가 부탁드려요💙\n이상 성글벙글의 촬영 후기 포스팅이었습니다😎","images":[{"t":"오브제스튜디오에서 찍은 두 부부 단체 사진 (대표사진)","n":"직접 찍은 사진 · [이미지 1] 자리","p":"직접 찍은 사진을 넣어 주세요"},{"t":"오브제스튜디오 입구와 간판","n":"직접 찍은 사진 · [이미지 2] 자리","p":"직접 찍은 사진을 넣어 주세요"},{"t":"스튜디오가 있는 건물 외관","n":"직접 찍은 사진 · [이미지 3] 자리","p":"직접 찍은 사진을 넣어 주세요"},{"t":"두 부부가 나란히 선 우정사진","n":"직접 찍은 사진 · [이미지 4] 자리","p":"직접 찍은 사진을 넣어 주세요"},{"t":"저희 부부 커플사진","n":"직접 찍은 사진 · [이미지 5] 자리","p":"직접 찍은 사진을 넣어 주세요"},{"t":"촬영 전 옷과 소품을 맞춰 보는 모습","n":"직접 찍은 사진 · [이미지 6] 자리","p":"직접 찍은 사진을 넣어 주세요"},{"t":"보정을 마친 사진 결과물","n":"직접 찍은 사진 · [이미지 7] 자리","p":"직접 찍은 사진을 넣어 주세요"},{"t":"스튜디오 내부 촬영 공간","n":"직접 찍은 사진 · [이미지 8] 자리","p":"직접 찍은 사진을 넣어 주세요"}],"tags":"#전주사진관 #전주우정사진 #전주커플사진 #오브제스튜디오 #오브제스튜디오전주점 #전주스튜디오 #전주가족사진 #전주사진관추천 #전주객사 #객리단길 #부부사진 #커플스냅 #우정사진 #사진관후기 #전주가볼만한곳 #전주데이트 #서이추 #이웃추가 #서이추환영","file":"content/reviews/2026-10-05-jeonju-objet-studio.md"}]</script>

<script>
const PRISTINE = "<!doctype html>\n" + document.documentElement.outerHTML;
const S = JSON.parse(document.getElementById("state").textContent);
const NEXT = {todo:"doing", doing:"done", done:"todo"};
const LABEL = {todo:"미완료", doing:"작성중", done:"작성완료"};
const RED = "#cc0000", BLUE = "#0b4da2", YEL = "#ffe97a", INK = "#000000";
const BASE = `color:${INK};`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const tidy = t => t
  .replace(/\n{2,}(?=\[이미지)/g, "\n").replace(/(^\[이미지.*$)\n{2,}/gm, "$1\n")
  .replace(/\n{2,}(?=인용구\(소제목\))/g, "\n").replace(/(^인용구\(소제목\).*$)\n{2,}/gm, "$1\n");

/* 화면 표시용 */
function paint(t){
  return esc(tidy(t))
    .replace(/^\[이미지\s*(\d+)\]\s*(.*)$/gm, '<span class="im">📷 이미지 $1 — $2</span>')
    .replace(/^인용구\(소제목\)\s*(.*)$/gm, '<span class="qt">$1</span>')
    .replace(/\[빨간글씨\]([\s\S]*?)\[\/빨간글씨\]/g, '<span class="rd">$1</span>')
    .replace(/\[파란글씨\]([\s\S]*?)\[\/파란글씨\]/g, '<span class="bl">$1</span>')
    .replace(/\[노란배경\]([\s\S]*?)\[\/노란배경\]/g, '<span class="yl">$1</span>');
}

/* 네이버 에디터에 붙여넣을 HTML. 인라인 style 이라야 서식이 살아서 들어간다.
   tidy() 는 화면 표시용이다. 여기서 쓰면 인용구·이미지 줄이 앞 문단에 붙어버린다. */
function toNaverHtml(t, keepImg){
  const parts = [];
  for (const block of t.trim().split(/\n\s*\n/)) {
    const lines = block.split("\n").map(l => l.trim()).filter(Boolean);
    const first = lines[0] || "";
    if (/^\[이미지\s*\d+\]/.test(first)) {
      if (keepImg) parts.push(`<p style="color:#999999;">${esc(first)}</p>`);
      continue;
    }
    if (first.startsWith("인용구(소제목)")) {
      // 네이버는 blockquote 를 자기 인용구 컴포넌트로 바꾼다(확인함).
      // 따옴표 장식과 정렬은 에디터가 직접 그리므로 여기서 넣으면 중복된다.
      // 인용구 종류(4번)는 붙여넣기로 지정할 수 없어 에디터에서 골라야 한다.
      const qt = esc(first.replace(/^인용구\(소제목\)\s*/, ""));
      parts.push(`<blockquote><p style="${BASE}">${qt}</p></blockquote>`);
      continue;
    }
    // 줄마다 별도 <p> 로 내보낸다.
    // <br> 은 네이버가 버려서 여러 줄이 한 줄로 뭉친다(확인함).
    // 문단의 기본 글자색도 반드시 명시한다. 없으면 앞 문단의 빨간색을
    // 그대로 상속해 본문 전체가 빨갛게 붙여넣어진다.
    const pieces = [];
    let carry = null;
    for (const line of lines) {
      const opens  = [...line.matchAll(/\[(빨간글씨|파란글씨|노란배경)\]/g)];
      const closes = [...line.matchAll(/\[\/(빨간글씨|파란글씨|노란배경)\]/g)];
      const applied = opens.length ? opens[0][1] : carry;
      if (opens.length && !closes.length) carry = opens[opens.length - 1][1];
      else if (closes.length) carry = null;

      const txt = esc(line.replace(/\[\/?(빨간글씨|파란글씨|노란배경)\]/g, "").trim());
      if (!txt) continue;
      pieces.push(
        applied === "빨간글씨" ? `<span style="color:${RED};font-weight:bold;">${txt}</span>` :
        applied === "파란글씨" ? `<span style="color:${BLUE};font-weight:bold;">${txt}</span>` :
        applied === "노란배경" ? `<span style="color:${INK};background-color:${YEL};font-weight:bold;">${txt}</span>` :
        txt);
    }
    for (const piece of pieces) parts.push(`<p style="${BASE}">${piece}</p>`);
    // 덩어리 사이 빈 줄
    if (pieces.length) parts.push(`<p style="${BASE}"><br></p>`);
  }
  while (parts.length && /^<p[^>]*><br><\/p>$/.test(parts[parts.length - 1])) parts.pop();
  return parts.join("\n");
}

/* 서식 없이 텍스트만 */
function toPlain(t, keepImg){
  return tidy(t).split("\n")
    .filter(l => keepImg || !/^\[이미지\s*\d+\]/.test(l.trim()))
    .map(l => l.replace(/^인용구\(소제목\)\s*/, "").replace(/\[\/?(빨간글씨|파란글씨|노란배경)\]/g, ""))
    .join("\n").replace(/\n{3,}/g, "\n\n").trim();
}

function flash(btn, msg){
  const was = btn.dataset.label || btn.textContent;
  btn.dataset.label = was;
  btn.textContent = msg || "복사됐어요";
  btn.classList.add("ok");
  setTimeout(() => { btn.textContent = was; btn.classList.remove("ok"); }, 1600);
}

async function copyRich(html, plain, btn){
  let done = false;
  try {
    if (window.ClipboardItem && navigator.clipboard && navigator.clipboard.write) {
      await navigator.clipboard.write([new ClipboardItem({
        "text/html":  new Blob([html],  {type: "text/html"}),
        "text/plain": new Blob([plain], {type: "text/plain"}),
      })]);
      done = true;
    }
  } catch { /* 아래 방식으로 다시 시도 */ }
  if (!done) {
    // 보이지 않는 편집영역을 선택해 복사하면 서식이 함께 실린다
    const d = document.createElement("div");
    d.contentEditable = "true";
    d.innerHTML = html;
    d.style.cssText = "position:fixed;left:-9999px;top:0;white-space:pre-wrap;";
    document.body.appendChild(d);
    const r = document.createRange(); r.selectNodeContents(d);
    const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
    try { document.execCommand("copy"); } catch {}
    sel.removeAllRanges(); d.remove();
  }
  flash(btn);
}

async function copyText(text, btn){
  try { await navigator.clipboard.writeText(text); }
  catch {
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.cssText = "position:fixed;left:-9999px";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch {}
    ta.remove();
  }
  flash(btn);
}

function render(){
  document.getElementById("meta").innerHTML =
    S.length ? `오늘 <b>${S.filter(x=>x.status==="done").length} / ${S.length}</b> 완료` : "";
  if (!S.length) {
    document.getElementById("list").innerHTML =
      `<p class="note" style="border:0">지금 올릴 원고가 없어요. 예약발행을 마친 글은 여기서 지웠어요.</p>`;
    return;
  }

  document.getElementById("list").innerHTML = S.map((p,i) => { const has = !!(p.body && p.body.trim()); return `
   <article class="card ${p.status}">
    <div class="chead">
      <div>
        ${p.date ? `<div class="kv" style="margin:0 0 4px"><span><b>${esc(p.date)}</b></span><span>${esc(p.type||"")}</span><span>${esc(p.note||"")}</span></div>` : ""}
        <h2 class="ctitle">${esc(p.title)}</h2>
        ${has ? "" : `<div class="kv"><span>원고 작성 전</span></div>`}
        <div class="kv" ${has ? "" : "hidden"}>
          <span>메인 <b>${esc(p.main)}</b> ${p.mainN}회</span>
          <span>검색량 <b>${esc(p.vol)}</b></span>
          <span>본문 <b>${p.chars}자</b> (공백 포함)</span>
        </div>
        <div class="kv" ${has ? "" : "hidden"}><span>서브 <code>${p.subs.map(esc).join(" · ")}</code></span></div>
      </div>
      <button class="pill ${p.status}" data-act="cycle" data-i="${i}">${LABEL[p.status]}</button>
    </div>
    <div class="actions" ${has ? "" : "hidden"}>
      <button class="btn pri" data-act="copy-rich" data-i="${i}">네이버용 서식 복사</button>
      <button class="btn" data-act="copy-plain" data-i="${i}">텍스트만 복사</button>
      <button class="btn" data-act="copy-tags" data-i="${i}">태그 복사</button>
      <button class="btn" data-act="toggle" data-i="${i}" data-t="ms">원고 보기</button>
      <button class="btn" data-act="toggle" data-i="${i}" data-t="img">이미지 프롬프트 ${p.images.length}장</button>
    </div>
    <p class="hint" ${has ? "" : "hidden"}>빨간·파란 글씨와 연한 노란 형광펜이 그대로 들어가요. 소제목은 인용구로 바뀌는데, 종류(4번)는 붙여넣은 뒤 에디터에서 골라주세요.</p>

    <div class="panel" id="ms${i}" hidden>
      <p class="ptitle">원고 전문</p>
      <pre class="ms">${paint(p.body)}</pre>
    </div>

    <div class="panel" id="img${i}" hidden>
      <p class="ptitle">이미지 프롬프트 — 한 장씩 복사해서 쓰세요</p>
      ${p.images.map((im,j) => `
        <div class="im-item">
          <div class="im-top">
            <span class="im-n">${j+1}</span>
            <div style="flex:1">
              <div class="im-t">${esc(im.t)}</div>
              <div class="im-note">${esc(im.n)}</div>
            </div>
          </div>
          <div class="im-p">${esc(im.p)}</div>
          <div class="im-act">
            <button class="btn" data-act="copy-prompt" data-i="${i}" data-j="${j}">프롬프트 복사</button>
          </div>
        </div>`).join("")}
      <p class="ptitle" style="margin-top:16px">해시태그 ${p.tags.split(/\s+/).filter(Boolean).length}개</p>
      <div class="tagline">${esc(p.tags)}</div>
    </div>
   </article>`; }).join("");
}

let saving = false;
async function save(){
  if (saving) return;
  saving = true;
  try {
    const api = await claude.use("artifact");
    if (!api) return;
    await api.publish(PRISTINE.replace(/(<script id="state"[^>]*>)[\s\S]*?(<\/script>)/,
      (m,a,b) => a + JSON.stringify(S).replace(/<\//g, "<\\/") + b));
  } catch { /* conflict 면 모든 창이 최신본으로 새로고침된다 */ }
  finally { saving = false; }
}

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b) return;
  const p = S[+b.dataset.i];
  switch (b.dataset.act) {
    case "cycle": p.status = NEXT[p.status]; render(); save(); break;
    case "toggle": {
      const el = document.getElementById(b.dataset.t + b.dataset.i);
      el.hidden = !el.hidden;
      b.textContent = el.hidden ? (b.dataset.t === "ms" ? "원고 보기" : `이미지 프롬프트 ${p.images.length}장`) : "접기";
      break;
    }
    case "copy-rich":   copyRich(toNaverHtml(p.body, true), toPlain(p.body, true), b); break;
    case "copy-plain":  copyText(toPlain(p.body, true), b); break;
    case "copy-tags":   copyText(p.tags, b); break;
    case "copy-prompt": copyText(p.images[+b.dataset.j].p, b); break;
  }
});

render();
</script>
