<script id="state" type="application/json">[{"id": "d1001-1", "status": "todo", "date": "10.01 (목)", "type": "정보성", "note": "10/12 시작. 70–74세 10/15, 65–69세 10/19 (검증)", "title": "독감 무료접종 75세 이상 언제부터인가요?", "main": "독감 무료접종", "subs": ["75세 이상", "위탁의료기관", "동시접종"], "vol": "미조회", "chars": 2323, "mainN": 11, "tags": "독감무료접종, 독감예방접종, 인플루엔자예방접종, 어르신독감접종, 75세이상독감, 독감접종일정, 65세이상무료접종, 위탁의료기관, 예방접종도우미, 코로나19예방접종, 동시접종, 부모님건강, 환절기건강, 겨울준비, 생활정보", "body": "안녕하세요\n매일매일 좋은 날을 나누는 성글벙글입니다😊\n저는 독감 무료접종이 10월만 되면\n어르신 누구나 바로 맞을 수 있는 줄 알았어요.\n\n그래서 오늘 아침 친정엄마께 전화를 드렸는데\n엄마가 먼저 물으시더라구요.\n\"병원 가도 되는 거니? 아직 아니라던데.\"\n그 말에 저도 날짜를 다시 찾아보게 됐어요.\n\n[이미지 1] 가을 거실에서 달력을 보며 웃는 노부부 (대표사진)\n\n인용구(소제목) 작년에 헛걸음하셨던 엄마\n\n저희 엄마는 올해 일흔일곱이세요.\n작년에는 동네 의원에 갔다가 아직 차례가 아니라서\n그냥 돌아오신 적이 있대요.\n나이대별로 시작일이 따로 있는 줄 몰랐던 거죠.\n\n주변 이야기를 들어봐도 비슷하더라구요.\n어르신 독감 무료접종은 한 번에 열리지 않고\n나이에 따라 며칠씩 나눠서 시작돼요.\n그래서 해마다 헛걸음하는 분들이 생겨요.\n\n[이미지 2] 식탁에서 고개를 갸웃하며 달력을 보는 모습\n\n인용구(소제목) 75세 이상은 10월 12일부터예요\n\n결론부터 말씀드릴게요.\n[빨간글씨]75세 이상 독감 무료접종은\n10월 12일(월)부터 시작돼요.\n10월 초에 가시면 아직 차례가 아니에요.[/빨간글씨]\n\n질병관리청 발표에 따르면 어르신 접종은\n75세 이상부터 시작해 나이대별로 이어져요.\n끝나는 날은 모두 2027년 4월 30일이라\n시작일만 잘 기억해 두시면 돼요.\n\n[이미지 3] 달력 한 칸에 살구색 동그라미가 쳐진 장면\n\n인용구(소제목) 나이별 시작일, 한눈에 정리\n\n[노란배경]75세 이상은 10월 12일,\n70~74세는 10월 15일,\n65~69세는 10월 19일부터예요.[/노란배경]\n\n나이는 주민등록상 출생연도로 나눠요.\n75세 이상은 1951년 12월 31일 이전에\n태어나신 분들이 해당돼요.\n생일이 지났는지는 따로 보지 않는 셈이에요.\n\n부모님 두 분의 나이대가 다르면\n독감 무료접종 시작일도 달라질 수 있어요.\n저희 집도 아빠는 일흔셋이라\n엄마보다 사흘 늦게 맞으셔야 하더라구요.\n두 분이 같이 가시려면 15일로 맞추면 돼요.\n\n[이미지 4] 나이대별로 계단처럼 선 세 장의 달력\n\n인용구(소제목) 어디서 맞으면 되나요\n\n독감 무료접종은 가까운 위탁의료기관이나\n보건소에서 받을 수 있어요.\n주소지와 상관없이 가까운 곳으로 가시면 돼요.\n자녀 집에 머무르고 계셔도 괜찮아요.\n평소 다니던 병원이 아니어도 된다는 뜻이에요.\n\n위탁의료기관은 질병관리청\n예방접종도우미 누리집에서 찾을 수 있어요.\n병원마다 백신이 들어오는 날이 다를 수 있어서\n위탁의료기관에 미리 전화해 보시면 좋아요.\n\n[이미지 5] 자녀가 어머니와 휴대폰으로 병원을 찾는 모습\n\n인용구(소제목) 코로나19와 동시접종해도 될까요\n\n올해는 65세 이상 코로나19 예방접종도\n독감 무료접종과 같은 시기에 시작돼요.\n질병관리청은 두 백신의 동시접종을 권하고 있어요.\n같은 날 양쪽 팔에 나눠 맞는 방식이에요.\n\n동시접종이 부담스러우시면\n날을 나눠 맞는 방법도 있어요.\n기저질환이 있거나 예전에 접종 후 불편했다면\n의료진과 먼저 상의해서 정하시는 게 좋아요.\n\n인용구(소제목) 이럴 땐 바로, 이럴 땐 잠깐 쉬었다가\n\n이런 날은 시작일에 맞춰 가셔도 좋아요.\n평소처럼 식사하시고 잠도 잘 주무셨고,\n열이나 기침 없이 컨디션이 괜찮은 날이에요.\n독감 무료접종은 이런 날 맞으시는 게 편해요.\n\n반대로 이런 날은 잠깐 미루는 게 나아요.\n열이 나거나 감기 기운이 심한 날,\n예전에 백신을 맞고 많이 붓거나\n숨이 차는 등 불편했던 적이 있는 경우예요.\n\n이럴 때는 날을 미루거나 의료진과 먼저 상의하세요.\n며칠 미룬다고 독감 무료접종 지원이 사라지지는 않아요.\n2027년 4월 30일까지 기간이 넉넉하거든요.\n\n[이미지 6] 머플러와 돋보기, 반창고가 가지런히 놓인 탁자\n\n인용구(소제목) 가기 전에 확인할 네 가지\n\n첫째, 신분증을 꼭 챙기세요.\n둘째, 열이 나거나 몸이 안 좋은 날은 미루세요.\n셋째, 다니는 위탁의료기관에 백신이 있는지\n전화로 먼저 확인하면 헛걸음이 줄어요.\n\n넷째, 코로나19 동시접종을 할지 미리 정하세요.\n그리고 접종 뒤에는 20~30분쯤\n병원에 머물면서 몸 상태를 살핀 뒤\n천천히 귀가하시면 돼요.\n\n인용구(소제목) 많이 물어보시는 것들\n\n10월 12일 전에 맞으면 어떻게 되는지 궁금하시죠.\n독감 무료접종은 나이별 시작일부터 적용돼요.\n그 전에 맞으시면 비용이 들 수 있으니\n시작일을 기다리시는 편이 나아요.\n\n작년에 맞았는데 또 맞아야 하는지도 물으세요.\n독감 백신은 해마다 유행할 바이러스에 맞춰\n새로 만들어져서 매년 맞는 걸 권하고 있어요.\n\n동시접종을 하면 더 아픈지도 궁금해하세요.\n질병관리청은 따로 맞을 때와 비슷하다고 안내해요.\n다만 사람마다 느끼는 정도는 다르니\n걱정되시면 접종 전에 의료진께 말씀드리세요.\n\n첫날에 꼭 가야 하는지도 많이 궁금해하세요.\n첫날은 붐비는 편이라 며칠 뒤에 가셔도 돼요.\n다만 유행이 오기 전에 맞는 게 좋으니\n너무 늦게까지 미루지는 마세요.\n\n[이미지 7] 창가에서 따뜻한 차를 마시며 쉬는 노부부\n\n인용구(소제목) 오늘 정리하면\n\n[빨간글씨]75세 이상 독감 무료접종은 10월 12일부터,\n가까운 위탁의료기관에서 신분증을 챙겨 가세요.[/빨간글씨]\n\n엄마는 통화를 끊고 달력에\n10월 12일을 크게 적어두셨대요.\n올해는 헛걸음할 일이 없겠다며 웃으시더라구요.\n날짜 하나 알았을 뿐인데 마음이 한결 놓였어요.\n12일 아침엔 제가 모시고 가기로 했답니다.\n\n[이미지 8] 병원을 나서며 웃는 할머니와 자녀\n\n이 글은 생활 정보로 정리한 내용이에요.\n건강 상태에 따라 접종 판단이 달라질 수 있으니\n걱정되시는 부분은 의료진과 상담해 주세요.\n\n이 글은 질병관리청의 인플루엔자\n국가예방접종 안내(2026-2027절기)를\n2026년 10월 1일 기준으로 정리했습니다.\n좋아요·공감과 이웃추가 부탁드려요💙\n이상 성글벙글의 건강 정보 포스팅이었습니다😎", "images": [{"t": "가을 거실에서 달력을 보며 웃는 노부부 (대표사진)", "n": "대표사진. 위쪽 3분의 1은 비워 제목 자리", "p": "In a cozy autumn living room, the grandma and grandpa sit side by side on a sofa, smiling and pointing together at a small blank wall calendar. A cup of warm tea on a low table. The Seonggeul grandma: a Korean woman in her late 70s, short white curly hair, round glasses, apricot knit cardigan. The Seonggeul grandpa: a Korean man in his late 70s, short gray hair, mint green vest over a white shirt. Soft matte clay 3D render, rounded chunky shapes, ha rly hair, round glasses, apricot knit cardigan. The Seonggeul adult child: a Korean woman in her 40s, shoulder-length brown bob hair, soft sky blue shirt. Soft matte clay 3D render, rounded chunky shapes, handmade plasticine texture, gentle soft studio lighting, pastel colors, clean simple background, cozy and warm mood, miniature diorama feel. Use mainly these colors: cream (#F6EFE3) background, apricot (#F2B8A0), mint (#A8D8C8), soft sky blue (#A9C8E8), warm brown (#8A6A55). Korean people and Korean everyday settings. Friendly, calm expressions. No syringes, no needles, no blood, no one in pain, nothing scary. Do not include any text, letters, numbers, logos or watermarks in the image."}]}, {"id": "d1001-2", "status": "todo", "title": "보일러 점검, 첫 가동 전 확인할 다섯 가지", "main": "보일러 점검", "subs": ["배기통", "일산화탄소 경보기", "환기구"], "vol": "미조회", "chars": 2313, "mainN": 11, "tags": "보일러점검, 보일러첫가동, 보일러켜기전, 가스보일러점검, 보일러배기통, 배기통점검, 일산화탄소경보기, 보일러실환기구, 가스안전, 난방준비, 겨울준비, 가을살림, 자취살림, 살림꿀팁, 생활정보", "body": "안녕하세요\n매일매일 좋은 날을 나누는 성글벙글입니다😊\n아침저녁으로 쌀쌀해지니 보일러 리모컨에\n자꾸 손이 가더라구요.\n저도 작년엔 여름 내내 꺼둔 보일러를\n아무 확인 없이 바로 켰어요.\n\n그러다 베란다 보일러실을 들여다봤는데\n배기통 이음새가 살짝 벌어져 있었어요.\n그날 이후로 보일러 점검은\n전원 버튼보다 먼저 하는 일이 됐습니다.\n\n[이미지 1] 베란다 보일러실 문을 열어둔 모습 (썸네일)\n\n인용구(소제목) 이사 온 첫 가을의 동생 이야기\n\n올봄에 빌라로 이사한 동생이 있어요.\n처음 맞는 가을이라 보일러가 어디 있는지만 알고\n한 번도 들여다본 적이 없었대요.\n\n첫 난방을 켜려던 날 제가 같이 가서 봤는데\n보일러실 환기구 앞에 짐 상자가 쌓여 있고\n일산화탄소 경보기는 달려 있지 않았어요.\n\n동생은 보일러 점검이 집주인이나\n관리실이 하는 일인 줄 알았대요.\n세입자가 봐도 되는 건지 몰라서\n그냥 두고 지냈다고 하더라구요.\n큰일이 난 건 아니었지만\n켜기 전에 봐서 다행이다 싶었어요.\n\n[이미지 2] 보일러실 앞에 쌓인 상자들\n\n인용구(소제목) 결론은 켜기 전에 오 분\n\n결론부터 말씀드릴게요.\n[빨간글씨]보일러 점검은 고장을 찾는 일이 아니라\n가스가 밖으로 잘 빠져나가는지 확인하는 일이에요.[/빨간글씨]\n\n배기통이 빠지거나 환기구가 막히면\n타고 남은 가스가 집 안으로 들어올 수 있어요.\n그래서 한국가스안전공사도 사용 전 점검으로\n배기통과 환기구를 먼저 꼽아요.\n오 분이면 충분하니 켜기 전에 한 번만 보세요.\n\n보일러 점검이라고 하면\n기사님을 불러야 하는 일처럼 느껴지는데,\n켜기 전에 하는 확인은\n눈으로 보는 게 대부분이에요.\n\n인용구(소제목) 보일러 점검은 배기통부터\n\n배기통은 보일러 위로 이어져\n바깥으로 연기를 내보내는 관이에요.\n[노란배경]배기통이 처지거나 꺾인 곳은 없는지,\n이음새가 벌어진 곳은 없는지 먼저 보세요.[/노란배경]\n\n장갑을 끼고 연결 부위를 살살 흔들어 봤을 때\n쉽게 빠지거나 헐거우면 손대지 마시고\n관리사무소나 보일러 업체에 점검을 요청하세요.\n직접 끼워 맞추는 것보다 그게 안전해요.\n\n여름 동안 베란다에 짐을 쌓아두셨다면\n옮기다 배기통을 건드렸을 수도 있어요.\n한 번 더 살펴보시는 게 좋아요.\n\n[이미지 3] 장갑 낀 손으로 배기통 이음새를 확인하는 장면\n\n인용구(소제목) 환기구는 늘 열어두기\n\n보일러실 환기구는 추워도 막지 않는 게 원칙이에요.\n찬바람이 들어온다고 비닐이나 신문지로\n막아두는 경우가 의외로 많더라구요.\n\n보일러실을 창고처럼 쓰고 계신다면\n환기구 앞과 보일러 주변은 비워두세요.\n공기가 들어오고 나가는 길이 막히면\n보일러가 제대로 숨을 쉬지 못해요.\n환기구에 먼지나 거미줄이 두껍게 끼어 있다면\n마른 솔로 가볍게 털어주세요.\n\n[이미지 4] 막힌 것 없이 열려 있는 보일러실 환기구\n\n인용구(소제목) 일산화탄소 경보기, 우리 집엔 있을까\n\n일산화탄소는 색도 냄새도 없어서\n사람이 알아채기 어려워요.\n그래서 일산화탄소 경보기가 필요해요.\n\n2020년 8월부터는 가스보일러를 새로 설치할 때\n일산화탄소 경보기를 함께 달도록 바뀌었어요.\n[노란배경]그 전에 설치한 보일러라면\n일산화탄소 경보기가 없을 수 있으니 확인해 보세요.[/노란배경]\n\n있다면 버튼을 눌러 소리가 나는지,\n전지형이라면 전지가 남아 있는지도 함께 보세요.\n다는 위치는 제품 설명서가 안내하는 곳을 따르세요.\n\n[이미지 5] 보일러실 벽에 달린 일산화탄소 경보기\n\n인용구(소제목) 켠 뒤에도 보일러 점검은 이어져요\n\n켜고 나서 연기나 불꽃이 보이거나,\n표시등이 깜박이며 켜지지 않거나,\n평소와 다른 소리나 냄새가 난다면\n바로 전원을 끄고 점검을 받으세요.\n\n가스 냄새가 난다면 창문을 열고\n전기 스위치는 건드리지 않은 채\n가스 밸브를 잠그고 가스 공급사에 연락하세요.\n\n처음 켜면 먼지 타는 냄새가 잠깐 날 수 있어요.\n금방 사라지면 괜찮지만\n계속된다면 점검을 받는 쪽이 안전해요.\n\n방마다 바닥이 고르게 따뜻해지는지도 느껴보세요.\n한 방만 계속 차갑다면 배관 쪽 문제일 수 있어\n업체에 문의해 보시면 돼요.\n\n[이미지 6] 보일러 조작부 표시등을 살펴보는 모습\n\n인용구(소제목) 보일러 점검 체크포인트\n\n첫째, 배기통이 처지거나 꺾이지 않았는지 봐요.\n둘째, 배기통 이음새가 헐겁지 않은지 확인해요.\n셋째, 보일러실 환기구가 막혀 있지 않은지 봐요.\n\n넷째, 일산화탄소 경보기가 달려 있고 작동하는지,\n다섯째, 켠 뒤 소리와 냄새가 평소와 같은지 봐요.\n\n[이미지 7] 체크리스트 메모를 들고 보일러를 보는 모습\n\n인용구(소제목) 많이 물어보시는 것들\n\n보일러 점검을 꼭 기사님께 맡겨야 하는지 물으시는데\n오늘 말씀드린 건 눈으로 보고 확인하는 수준이에요.\n헐겁거나 이상한 게 보이면 그때 부르시면 돼요.\n\n아파트라서 괜찮겠지 하시는 분도 많아요.\n보일러실 구조는 집마다 달라서\n세대마다 한 번씩 보는 게 좋아요.\n\n보일러 점검은 언제 하는 게 좋은지도 궁금해하세요.\n난방을 처음 켜기 전인 이맘때가 좋아요.\n한겨울에 문제가 생기면 수리 예약을\n한참 기다려야 할 수도 있거든요.\n\n[이미지 8] 아파트 베란다와 보일러실 전경\n\n인용구(소제목) 오늘 정리하면\n\n[빨간글씨]배기통 이음새, 보일러실 환기구,\n일산화탄소 경보기 세 가지를 켜기 전에 확인하세요.[/빨간글씨]\n\n[이미지 9] 따뜻한 조명 아래 거실 바닥에 앉은 가족\n\n동생은 그날 상자를 치우고\n일산화탄소 경보기를 하나 달았어요.\n관리실에도 배기통을 한 번 봐달라고 부탁했고요.\n첫 난방을 켜면서 괜히 마음이 놓인다고 하더라구요.\n\n보일러 점검은 한 해에 한 번,\n찬바람 불 때 오 분이면 끝나요.\n보일러 기종마다 다를 수 있으니\n설명서도 한 번 함께 확인해 주세요.\n\n[이미지 10] 보일러 리모컨으로 난방을 켜는 손\n\n이 글은 한국가스안전공사의 가스보일러 안전수칙을\n2026년 9월 29일 기준으로 정리했습니다.\n좋아요·공감과 이웃추가 부탁드려요💙\n이상 성글벙글의 난방 준비 포스팅이었습니다😎", "images": [{"t": "베란다 보일러실 문 열어둔 모습 (썸네일)", "n": "한국 아파트 베란다 보일러실. 브랜드 로고 안 보이게.", "p": "An open door of a small utility room on a Korean apartment balcony revealing a white wall-mounted gas boiler with exhaust pipe, clean and tidy, natural daylight, photorealistic interior photography, eye level, 4:3, no logos, no text"}, {"t": "보일러실 앞에 쌓인 상자들", "n": "환기구를 막는 짐 느낌.", "p": "Cardboard boxes and household items piled in front of a boiler utility room on a Korean apartment balcony, partially blocking a wall vent, natural light, photorealistic, no logos, no readable text"}, {"t": "장갑 낀 손으로 배기통 이음새 확인", "n": "배기통 연결부 클로즈업.", "p": "Close-up of a gloved hand gently checking the joint of a metal boiler exhaust flue pipe connected to a wall-mounted gas boiler, soft light, photorealistic, shallow depth of field, no logos, no text"}, {"t": "열려 있는 보일러실 환기구", "n": "막힘 없는 환기구.", "p": "A clean open ventilation grille on the wall of a boiler room in a Korean apartment balcony, nothing blocking it, daylight, photorealistic, straight-on view, no text"}, {"t": "벽에 달린 일산화탄소 경보기", "n": "경보기 제품명·글자 안 보이게.", "p": "A small white carbon monoxide alarm mounted on a utility room wall near a gas boiler, clean and simple, soft light, photorealistic, close-up, no brand name, no readable text"}, {"t": "보일러 조작부 표시등 살펴보기", "n": "표시등 정도만. 숫자·로고 흐리게.", "p": "A person looking closely at the control panel lights of a wall-mounted gas boiler, indicator light glowing softly, dim utility room, photorealistic, shallow depth of field, no logos, no readable text"}, {"t": "체크리스트 들고 보일러 보는 모습", "n": "메모 글씨 읽히지 않게.", "p": "A young Korean man holding a small notepad checklist (illegible) while looking at a wall-mounted gas boiler in a balcony utility room, daylight, photorealistic lifestyle photography, no logos, no readable text"}, {"t": "아파트 베란다와 보일러실 전경", "n": "구조가 보이게 한 발 물러서서.", "p": "Wide view of a Korean apartment enclosed balcony with a boiler utility room door, laundry rack and plants, afternoon light, photorealistic interior photography, no logos, no text"}, {"t": "따뜻한 거실 바닥에 앉은 가족", "n": "난방이 들어온 편안한 분위기.", "p": "A Korean family sitting on a warm heated floor in a cozy living room, soft blankets, warm lamp light, relaxed atmosphere, photorealistic lifestyle photography, no text, no logos"}, {"t": "리모컨으로 난방 켜는 손", "n": "마무리 컷. 화면 글자 흐리게.", "p": "Close-up of a hand pressing a button on a wall-mounted home heating thermostat controller, screen softly glowing and unreadable, warm home interior blurred behind, photorealistic, no logos, no readable text"}], "date": "10.01 (목)", "type": "정보성", "note": "난방 전환기 · 매년 재사용 — 9/29 작성본을 그대로 옮김"}, {"id": "d1001-3", "status": "todo", "date": "10.01 (목)", "type": "검색유입", "note": "맛집 글로 연결되는 고리", "title": "대하 제철 언제까지 맛있나요?", "main": "대하 제철", "subs": ["흰다리새우", "대하 소금구이", "대하 손질"], "vol": "미조회", "chars": 2328, "mainN": 13, "tags": "대하제철, 대하, 가을대하, 대하소금구이, 대하손질, 흰다리새우, 대하흰다리새우구별, 제철수산물, 가을제철음식, 새우구이, 대하요리, 대하보관, 수산시장, 가을맛집, 생활정보", "body": "안녕하세요\n매일매일 좋은 날을 나누는 성글벙글입니다😊\n저는 가을만 되면 대하가 먹고 싶어지는데\n언제까지가 맛있는 때인지는 늘 헷갈렸어요.\n\n지난 주말 동네 수산시장에 갔다가\n사장님께 여쭤보니 한참 설명을 해주시더라구요.\n그날 들은 이야기와 공식 자료를 함께 찾아보고\n대하 제철을 한 번에 정리해 봤어요.\n고르는 법부터 집에서 굽는 법까지 담았어요.\n\n[이미지 1] 나무 쟁반 위 소금구이 대하와 가을 낙엽 (대표사진)\n\n인용구(소제목) 대하라고 샀는데 대하가 아니었던 날\n\n작년 이맘때 제 동생이 대하를 사 왔다며\n소금구이를 해준 적이 있어요.\n그런데 시장 사장님 말씀을 듣고 나니\n그게 흰다리새우였을 가능성이 크더라구요.\n\n동생도 가게에서 대하라고 해서 샀대요.\n맛있게 먹었으니 손해 본 건 아니지만\n알고 고르는 것과 모르고 사는 건 다르잖아요.\n그래서 올해는 구별하는 법부터 배워 왔어요.\n사장님이 새우 두 마리를 나란히 놓고 보여주셨거든요.\n\n[이미지 2] 새우 두 마리를 나란히 놓고 들여다보는 모습\n\n인용구(소제목) 대하 제철은 가을, 특히 9~10월\n\n결론부터 말씀드릴게요.\n[빨간글씨]대하 제철은 가을이고,\n살이 통통하게 차오르는 건 9~10월이에요.[/빨간글씨]\n\n해양수산부는 10월 이달의 수산물로\n대하를 고른 적도 있어요.\n그만큼 이 시기가 대하 제철의 한가운데라는 뜻이에요.\n11월까지도 찾는 분들이 많지만\n찬바람이 깊어질수록 자연산은 보기 어려워져요.\n\n그러니 대하 제철을 제대로 누리려면\n10월 안에 한 번 챙겨 드시는 게 좋아요.\n주말 나들이 겸 수산시장에 들르기도 딱 좋은 때예요.\n\n[이미지 3] 가을 달력 위에 놓인 작은 새우 한 마리\n\n인용구(소제목) 흰다리새우와 헷갈리지 않으려면\n\n시장에서 흔히 보는 새우 중 상당수는\n양식 흰다리새우예요.\n국립수산과학원에 따르면 우리나라는\n대하 양식이 아주 적고 대부분 흰다리새우를 길러요.\n\n[노란배경]구별할 때는 수염과 머리 뿔을 보세요.\n대하는 수염이 훨씬 길고,\n머리 앞쪽 뾰족한 뿔도 더 길게 뻗어 있어요.[/노란배경]\n\n흰다리새우가 나쁘다는 뜻은 아니에요.\n맛도 좋고 값도 부담이 덜하거든요.\n다만 가격은 몇 배씩 차이 나기도 하니\n대하 제철에 대하 값을 낸다면 한 번 확인해 보세요.\n\n[이미지 4] 수염 길이가 다른 새우 두 마리를 비교하는 장면\n\n인용구(소제목) 대하 손질은 가위 하나면 돼요\n\n대하 손질은 생각보다 간단해요.\n먼저 흐르는 물에 가볍게 헹궈 주세요.\n그다음 가위로 긴 수염과 머리 앞 뾰족한 뿔,\n다리 끝을 잘라내면 굽다가 타지 않아요.\n\n등 쪽 둘째 마디 사이에 이쑤시개를 넣어\n검은 내장을 살살 빼내면 쓴맛이 줄어요.\n대하 손질은 여기까지면 충분해요.\n껍질째 구우면 살이 촉촉하게 남거든요.\n\n[이미지 5] 가위로 새우 수염을 자르는 손\n\n인용구(소제목) 집에서 하는 대하 소금구이\n\n대하 소금구이는 팬이나 냄비 바닥에\n굵은소금을 넉넉히 까는 데서 시작해요.\n소금이 달궈지면 손질한 대하를 올리고\n뚜껑을 덮어 중불에서 익혀 주세요.\n\n껍질이 주황빛으로 바뀌고\n살이 하얗게 차오르면 다 익은 거예요.\n대하 소금구이는 소금에 직접 간을 하지 않아서\n짜지 않고 새우 본연의 단맛이 살아요.\n머리는 따로 바삭하게 한 번 더 구워 드셔도 좋아요.\n버터를 조금 올리면 고소한 맛이 더해져요.\n\n[이미지 6] 굵은소금 위에서 익어가는 새우\n\n인용구(소제목) 대하 제철이어도 아쉬울 수 있어요\n\n이런 대하는 제철 맛을 제대로 느끼기 좋아요.\n껍질에 윤기가 돌고 몸이 단단하며,\n머리와 몸통이 잘 붙어 있는 것들이에요.\n대하 제철에 막 들어온 것일수록 이런 모습이에요.\n\n반대로 대하 제철이라도 아쉬운 경우가 있어요.\n머리가 검게 변했거나 몸이 물렁한 것,\n껍질과 살 사이가 들뜬 것은 신선도가 떨어져요.\n이럴 땐 값이 싸도 한 번 더 생각해 보세요.\n\n사 와서 바로 굽지 못하면 대하 손질을 먼저 하세요.\n수염과 내장을 정리해 두면 냉동해도 냄새가 덜해요.\n\n인용구(소제목) 사기 전에 확인할 것들\n\n첫째, 수염과 머리 뿔 길이를 먼저 보세요.\n둘째, 껍질이 윤기 있고 단단한지 확인하세요.\n셋째, 머리가 검게 변한 건 피하는 게 좋아요.\n넷째, 자연산인지 양식인지 가게에 여쭤보세요.\n\n바로 드실 게 아니라면\n손질 후 한 번 먹을 만큼씩 나눠 냉동해 두세요.\n해동은 냉장실에서 천천히 하는 게 식감이 좋아요.\n\n인용구(소제목) 많이 물어보시는 것들\n\n대하 소금구이에 쓴 소금을 다시 써도 되는지 물으세요.\n새우 즙이 배어 있어서\n한 번 쓰고 버리는 게 깔끔해요.\n\n식당에서 대하인지 흰다리새우인지\n알 수 있는지도 궁금해하세요.\n익힌 뒤에도 수염 길이는 남아 있어서\n접시에 나온 새우의 수염을 보면 짐작할 수 있어요.\n\n11월에도 대하 제철 맛이 나는지\n물으시는 분도 계세요.\n먹을 수는 있지만 자연산은 점점 줄어들고\n양식 새우가 대부분이라 고를 때 더 살펴봐야 해요.\n\n대하 손질 없이 통째로 구워도 되는지도 많이 물으세요.\n구울 수는 있지만 수염과 뿔이 타면서 냄새가 나고\n내장 때문에 쓴맛이 날 수 있어요.\n\n[이미지 7] 식탁에 둘러앉아 새우구이를 나눠 먹는 가족\n\n인용구(소제목) 오늘 정리하면\n\n[빨간글씨]대하 제철은 9~10월이 한가운데예요.\n수염과 머리 뿔로 흰다리새우와 구별하세요.[/빨간글씨]\n\n올해 동생은 시장에서 수염부터 들여다보고\n진짜 대하로 대하 소금구이를 해줬어요.\n작년과 맛을 비교하며 한참 웃었답니다.\n이번 대하 제철에는 한 번 직접 골라 보세요.\n수염 하나만 봐도 장보기가 훨씬 재밌어지더라구요.\n\n[이미지 8] 빈 접시와 새우 껍질만 남은 가을 저녁 식탁\n\n이 글은 해양수산부의 이달의 수산물 자료와\n국립수산과학원의 수산물 구별 안내를\n2026년 10월 1일 기준으로 정리했습니다.\n좋아요·공감과 이웃추가 부탁드려요💙\n이상 성글벙글의 제철 음식 포스팅이었습니다😎", "images": [{"t": "나무 쟁반 위 소금구이 대하와 가을 낙엽 (대표사진)", "n": "대표사진. 위쪽 3분의 1은 비워 제목 자리", "p": "Salt-grilled clay prawns on a wooden tray over coarse salt, a few orange autumn leaves around, warm cozy table. Soft matte clay 3D render, rounded chunky shapes, handmade plasticine texture, gentle soft studio lighting, pastel colors, clean simple background, cozy and warm mood, miniature diorama feel. Use mainly these colors: cream (#F6EFE3) background, apricot (#F2B8A0), mint (#A8D8C8), soft sky blue (#A9C8E8), warm brown (#8A6A55). Korean people and Korean everyday settings. Friendly, calm expressions. No syringes, no needles, no blood, no one in pain, nothing scary. Do not include any text, letters, numbers, logos or watermarks in the image. Keep the top third of the image as plain empty cream background with nothing in it, so a title can be placed there later. Put all subjects in the lower two thirds."}, {"t": "새우 두 마리를 나란히 놓고 들여다보는 모습", "n": "사례 — 시장에서 구별법 배우기", "p": "The blog host leans over a market counter looking closely at two clay prawns placed side by side, curious expression. Seonggeul, the blog host: a Korean woman in her 30s, round face, dark hair in a low bun, cream sweater with a mint scarf. Soft matte clay 3D render, rounded chunky shapes, handmade plasticine texture, gentle soft studio lighting, pastel colors, clean simple background, cozy and warm mood, miniature diorama feel. Use mainly these colors: cream (#F6EFE3) background, apricot (#F2B8A0), mint (#A8D8C8), soft sky blue (#A9C8E8), warm brown (#8A6A55). Korean people and Korean everyday settings. Friendly, calm expressions. No syringes, no needles, no blood, no one in pain, nothing scary. Do not include any text, letters, numbers, logos or watermarks in the image."}, {"t": "가을 달력 위에 놓인 작은 새우 한 마리", "n": "결론 — 9~10월 제철", "p": "A single small clay prawn resting on a blank autumn wall calendar page, soft light. Soft matte clay 3D render l. Use mainly these colors: cream (#F6EFE3) background, apricot (#F2B8A0), mint (#A8D8C8), soft sky blue (#A9C8E8), warm brown (#8A6A55). Korean people and Korean everyday settings. Friendly, calm expressions. No syringes, no needles, no blood, no one in pain, nothing scary. Do not include any text, letters, numbers, logos or watermarks in the image."}]}, {"id": "d1001-4", "status": "todo", "date": "10.01 (목)", "type": "검색유입", "note": "연휴 캠핑 수요", "title": "가을 캠핑 추위, 준비물 뭘 더 챙기나요?", "main": "가을 캠핑", "subs": ["캠핑 준비물", "침낭", "일산화탄소 경보기"], "vol": "미조회", "chars": 2318, "mainN": 11, "tags": "가을캠핑, 가을캠핑준비물, 캠핑준비물, 캠핑추위, 가을캠핑추위, 침낭, 침낭고르기, 캠핑매트, 일산화탄소경보기, 캠핑안전, 텐트난방, 캠핑핫팩, 연휴캠핑, 캠핑초보, 생활정보", "body": "안녕하세요\n매일매일 좋은 날을 나누는 성글벙글입니다😊\n저는 가을 캠핑이 여름보다 편할 줄 알았어요.\n덥지도 않고 벌레도 적으니까요.\n\n그런데 작년 10월, 처음으로 가을 캠핑을 갔다가\n밤새 한숨도 못 잤어요.\n낮엔 반팔이었는데 해가 지니 손이 곱더라구요.\n그날 이후로 캠핑 준비물 목록이 완전히 바뀌었어요.\n오늘은 그때 배운 걸 순서대로 정리해 볼게요.\n\n[이미지 1] 노을 진 캠핑장, 담요를 덮고 앉은 사람들 (대표사진)\n\n인용구(소제목) 여름 짐 그대로 갔던 첫 가을 밤\n\n그때 저희는 여름에 쓰던 짐을 그대로 챙겼어요.\n얇은 침낭 하나, 돗자리 같은 얇은 매트,\n긴팔 티셔츠 한 장이 전부였죠.\n낮 기온만 보고 괜찮겠다 싶었거든요.\n\n밤이 깊어지자 바닥에서 냉기가 올라왔어요.\n침낭 안에서 몸을 웅크려도 등이 시리고,\n새벽엔 결국 차에 들어가 히터를 켰어요.\n같이 간 친구도 다음 날 목이 잠겨 있더라구요.\n즐거우려고 간 캠핑이 고생으로 끝난 셈이었어요.\n\n[이미지 2] 텐트 안 얇은 침낭 속에서 웅크린 모습\n\n인용구(소제목) 결론은 바닥과 잠자리부터\n\n결론부터 말씀드릴게요.\n[빨간글씨]가을 캠핑 추위는 공기보다\n바닥에서 올라오는 냉기가 더 크게 느껴져요.\n그래서 매트와 침낭부터 바꿔야 해요.[/빨간글씨]\n\n옷을 두껍게 입는 것도 중요하지만\n잠자리가 차가우면 밤새 체온을 빼앗겨요.\n가을 캠핑 준비는 잠자리, 옷, 안전\n이 세 가지 순서로 챙기시면 돼요.\n\n[이미지 3] 두꺼운 매트를 두 겹 깐 텐트 바닥\n\n인용구(소제목) 잠자리는 두 겹으로\n\n매트는 한 장보다 두 장이 따뜻해요.\n[노란배경]바닥에 발포 매트를 깔고\n그 위에 에어매트나 자충 매트를 올리면\n냉기가 한결 덜 올라와요.[/노란배경]\n\n침낭은 적정 온도 표시를 확인하세요.\n표시된 온도는 제품마다 기준이 달라서\n캠핑장 밤 기온보다 넉넉한 쪽을 고르는 게 편해요.\n여름 침낭 안에 담요를 한 장 넣는 것도 방법이에요.\n침낭 입구를 조여 목 쪽 틈을 막으면 더 따뜻해요.\n\n산이나 계곡 옆 캠핑장은\n도심보다 밤 기온이 더 떨어지는 편이에요.\n가기 전에 그 지역 밤 기온 예보를 꼭 보세요.\n캠핑장 누리집에 안내가 있는 곳도 있어요.\n\n[이미지 4] 침낭 안에 담요를 겹쳐 넣는 손\n\n인용구(소제목) 옷은 얇게 여러 겹\n\n가을 캠핑에는 두꺼운 옷 한 벌보다\n얇은 옷을 여러 겹 입는 게 편해요.\n낮에는 벗고 밤에는 더 입으면서\n체온을 맞출 수 있거든요.\n\n잘 때 입을 옷은 따로 챙기세요.\n낮에 땀이 밴 옷을 그대로 입고 자면\n밤에 더 춥게 느껴질 수 있어요.\n수면 양말과 목을 감쌀 머플러도\n캠핑 준비물에 꼭 넣어 주세요.\n\n[이미지 5] 캠핑 의자 위에 겹쳐 놓인 옷과 머플러\n\n인용구(소제목) 텐트 안 난방은 조심해야 해요\n\n추우면 텐트 안에서 난로를 켜고 싶어지죠.\n소방청은 텐트 안에서 난로나 온열기기를\n사용하지 말고, 불은 텐트 밖에서 쓰라고 안내해요.\n숯이나 장작을 안으로 들이는 것도 위험해요.\n\n일산화탄소는 색도 냄새도 없어서 알아채기 어려워요.\n[노란배경]그래서 일산화탄소 경보기를 챙기고,\n소방청 안내대로 텐트 윗부분에 달아 두세요.[/노란배경]\n자주 환기하는 것도 잊지 마세요.\n\n일산화탄소 경보기는 건전지가 살아 있는지\n출발 전에 버튼을 눌러 소리를 확인해 두세요.\n전기요를 쓴다면 캠핑장 전기 용량도 미리 확인하세요.\n\n[이미지 6] 텐트 천장에 매달린 작은 경보기\n\n인용구(소제목) 이렇게 챙기면 편하고, 이러면 추워요\n\n편하게 잔 날의 캠핑 준비물은 이랬어요.\n두 겹 매트, 밤 기온에 맞춘 침낭,\n잘 때만 입는 마른 옷과 수면 양말이었어요.\n불은 저녁 식사 뒤 텐트 밖에서만 썼고요.\n\n추웠던 날은 반대였어요.\n얇은 매트 한 장에 여름 침낭,\n낮에 입던 옷 그대로 잠자리에 들었죠.\n가을 캠핑은 이 차이가 밤새 이어지더라구요.\n\n같은 캠핑장, 같은 날씨라도\n캠핑 준비물 몇 가지로 밤이 완전히 달라져요.\n짐이 늘어나는 게 부담이라면\n옷보다 매트를 먼저 챙기시길 권해요.\n\n인용구(소제목) 떠나기 전 확인할 것\n\n첫째, 매트가 두 겹인지 확인하세요.\n둘째, 침낭 적정 온도와 밤 기온 예보를 비교하세요.\n셋째, 잘 때 입을 마른 옷과 수면 양말을 챙기세요.\n넷째, 일산화탄소 경보기와 여분 건전지를 넣으세요.\n\n다섯째, 불씨는 끝까지 꺼졌는지 보고 잠드세요.\n이 다섯 가지만 챙겨도\n가을 캠핑 밤이 훨씬 편안해져요.\n\n인용구(소제목) 많이 물어보시는 것들\n\n핫팩을 침낭에 넣고 자도 되는지 물으세요.\n따뜻하긴 하지만 피부에 오래 닿으면\n저온 화상이 생길 수 있어요.\n수건으로 감싸 발치에 두는 편이 안전해요.\n잠들기 전에 한 번 더 위치를 확인해 주세요.\n\n가을 캠핑에 전기요만 있으면 되는지도 궁금해하세요.\n전기요는 위에서 데워 주지만\n바닥 냉기까지 막아 주지는 못해요.\n매트를 먼저 챙기고 전기요를 더하는 게 순서예요.\n\n차박도 같은 캠핑 준비물이면 되는지도 많이 물으세요.\n차 안도 밀폐된 공간이라\n시동을 켠 채 자거나 난로를 켜는 건 피하세요.\n차박할 때도 일산화탄소 경보기는 챙겨 가세요.\n\n[이미지 7] 모닥불 앞에서 따뜻한 차를 나눠 마시는 두 사람\n\n인용구(소제목) 오늘 정리하면\n\n[빨간글씨]매트는 두 겹, 침낭은 밤 기온에 맞게,\n난방은 텐트 밖에서, 일산화탄소 경보기는 꼭 챙기세요.[/빨간글씨]\n\n올해 개천절 연휴에 같은 캠핑장에 다시 가요.\n이번엔 매트를 두 장 깔고 침낭도 바꿨어요.\n친구가 작년 이야기를 꺼내며 웃더라구요.\n올해 가을 캠핑은 아침까지 푹 잘 수 있을 것 같아요.\n첫 가을 캠핑을 앞두셨다면 매트부터 챙겨 보세요.\n\n[이미지 8] 아침 햇살 속 텐트 앞에서 기지개 켜는 모습\n\n이 글은 소방청의 캠핑 안전수칙 안내를\n2026년 10월 1일 기준으로 정리했습니다.\n좋아요·공감과 이웃추가 부탁드려요💙\n이상 성글벙글의 캠핑 준비 포스팅이었습니다😎", "images": [{"t": "노을 진 캠핑장, 담요를 덮고 앉은 사람들 (대표사진)", "n": "대표사진. 위쪽 3분의 1은 비워 제목 자리", "p": "At a campsite at sunset, the blog host sits wrapped in a blanket in front of a small tent, autumn trees behind. Seonggeul, the blog host: a Korean woman in her 30s, round face, dark hair in a low bun m expressions. No syringes, no needles, no blood, no one in pain, nothing scary. Do not include any text, letters, numbers, logos or watermarks in the image."}, {"t": "모닥불 앞에서 따뜻한 차를 나눠 마시는 두 사람", "n": "Q&A 쉼표 컷", "p": "The blog host and a friend sit by a small campfire outside the tent sharing warm drinks from mugs. Seonggeul, the blog host: a Korean woman in her 30s, round face, dark hair in a low bun, cream sweater with a mint scarf. Soft matte clay 3D render, rounded chunky shapes, handmade plasticine texture, gentle soft studio lighting, pastel colors, clean simple background, cozy and warm mood, miniature diorama feel. Use mainly these colors: cream (#F6EFE3) background, apricot (#F2B8A0), mint (#A8D8C8), soft sky blue (#A9C8E8), warm brown (#8A6A55). Korean people and Korean everyday settings. Friendly, calm expressions. No syringes, no needles, no blood, no one in pain, nothing scary. Do not include any text, letters, numbers, logos or watermarks in the image."}, {"t": "아침 햇살 속 텐트 앞에서 기지개 켜는 모습", "n": "정리 — 푹 잔 아침", "p": "Morning sunlight at a campsite, the blog host stretching happily in front of the tent. Seonggeul, the blog host: a Korean woman in her 30s, round face, dark hair in a low bun, cream sweater with a mint scarf. Soft matte clay 3D render, rounded chunky shapes, handmade plasticine texture, gentle soft studio lighting, pastel colors, clean simple background, cozy and warm mood, miniature diorama feel. Use mainly these colors: cream (#F6EFE3) background, apricot (#F2B8A0), mint (#A8D8C8), soft sky blue (#A9C8E8), warm brown (#8A6A55). Korean people and Korean everyday settings. Friendly, calm expressions. No syringes, no needles, no blood, no one in pain, nothing scary. Do not include any text, letters, numbers, logos or watermarks in the image."}]}, {"id": "d1001-5", "status": "todo", "date": "10.01 (목)", "type": "홈판", "note": "계절 전환 공감", "title": "옷장 정리, 10월 첫날 맨 앞줄을 바꿨어요", "main": "옷장 정리", "subs": ["가을 옷", "일교차", "환절기 옷"], "vol": "미조회", "chars": 2318, "mainN": 11, "tags": "옷장정리, 가을옷정리, 가을옷, 환절기옷, 환절기옷차림, 일교차옷차림, 옷장정리법, 계절옷정리, 옷정리, 10월일상, 가을맞이, 살림기록, 미니멀라이프, 일상기록, 생활정보", "body": "안녕하세요\n매일매일 좋은 날을 나누는 성글벙글입니다😊\n오늘 아침 옷장을 열었는데\n맨 앞줄이 아직 반팔 티셔츠더라구요.\n\n날짜는 벌써 10월 1일인데\n옷장은 아직 8월에 머물러 있었어요.\n출근 준비를 하다 말고 한참 서 있다가\n오늘 저녁엔 옷장 정리를 하자고 마음먹었어요.\n\n[이미지 1] 가을 햇살이 드는 방, 옷장 앞에 선 모습 (대표사진)\n\n인용구(소제목) 매일 아침 같은 고민을 하던 9월\n\n사실 9월 내내 아침마다 같은 고민을 했어요.\n아침엔 쌀쌀해서 카디건을 찾는데\n카디건은 옷장 깊숙한 곳에 있고,\n낮엔 더워서 결국 손에 들고 다녔거든요.\n사무실 의자에 걸어둔 카디건만 세 벌이 됐어요.\n\n일교차가 큰 날이 이어지니\n입고 나간 옷이 오후엔 짐이 되더라구요.\n그러면서도 옷장 정리는 주말로 미루기만 했어요.\n주말이 오면 또 다른 일이 생기고요.\n\n[이미지 2] 반팔 옷들이 앞줄에 걸린 옷장\n\n인용구(소제목) 전부 바꾸지 않고 앞줄만\n\n오늘 옷장 정리는 딱 하나만 정했어요.\n[빨간글씨]옷장 전체가 아니라 맨 앞줄만 바꾸기.[/빨간글씨]\n이것만 해도 아침이 달라질 것 같았거든요.\n퇴근하고 저녁을 먹은 뒤 바로 시작했어요.\n\n예전엔 옷장 정리를 하려면\n주말 하루를 통째로 비워야 한다고 생각했어요.\n그래서 늘 시작을 못 했던 것 같아요.\n앞줄만 바꾸니 한 시간도 안 걸리더라구요.\n\n[이미지 3] 옷걸이에 가을 옷을 하나씩 거는 손\n\n인용구(소제목) 앞줄에 올린 가을 옷\n\n앞줄에는 가을 옷 중에서도\n바로 이번 주에 입을 것만 골라 걸었어요.\n얇은 니트 두 벌, 카디건 한 벌,\n셔츠 세 장과 긴바지 두 벌이에요.\n\n[노란배경]기준은 하나였어요.\n겹쳐 입었다 벗었다 하기 쉬운 옷이요.[/노란배경]\n일교차가 큰 요즘엔 두꺼운 옷 한 벌보다\n얇은 옷 여러 벌이 훨씬 쓸모가 있더라구요.\n\n두꺼운 가을 옷은 아직 뒤쪽에 두었어요.\n10월 중순이 지나 아침 공기가 더 차가워지면\n그때 한 번 더 자리를 바꿀 생각이에요.\n일교차가 줄고 낮에도 쌀쌀해지는 때가 신호예요.\n\n[이미지 4] 얇은 니트와 카디건이 나란히 걸린 앞줄\n\n인용구(소제목) 반팔은 한 번에 치우지 않았어요\n\n반팔 티셔츠는 전부 넣지 않고\n두세 장만 옆 칸에 남겨 두었어요.\n낮에는 아직 반팔이 필요한 날이 있거든요.\n환절기 옷은 이렇게 섞어 두는 게 편하더라구요.\n\n나머지 여름 반팔은 한 번 세탁해서\n뒤쪽 칸으로 옮겼어요.\n완전히 보관 상자에 넣는 건\n아침저녁으로 제법 추워진 뒤에 하려고요.\n\n[이미지 5] 반팔 몇 장만 남긴 옆 칸과 정리된 뒷줄\n\n인용구(소제목) 환절기 옷, 이렇게 겹쳐 입고 있어요\n\n앞줄을 바꾸고 나서 옷 입는 방식도 정했어요.\n안에는 얇은 반팔이나 셔츠를 입고,\n그 위에 니트나 카디건을 걸치는 식이에요.\n일교차가 큰 날엔 이 조합이 참 편하더라구요.\n\n아침 출근길엔 카디건까지 입고 나가고\n점심때 따뜻해지면 벗어서 가방에 넣어요.\n그래서 가방에 쏙 들어가는 얇은 가을 옷이\n요즘 제 옷장에서 손이 자주 가는 옷이 됐어요.\n\n환절기 옷을 고를 때는\n벗었을 때 구김이 덜 가는 소재가 편해요.\n하루에도 몇 번씩 입었다 벗었다 하니까요.\n\n인용구(소제목) 정리하면서 알게 된 것\n\n옷장 정리를 하다 보니\n작년 가을에 산 옷 중에\n한 번도 안 입은 셔츠가 두 장이나 있었어요.\n태그도 그대로 달려 있더라구요.\n살 때는 분명 잘 입을 것 같았는데 말이에요.\n\n잘 입는 옷은 늘 정해져 있고\n나머지는 자리만 차지하고 있었던 거예요.\n앞줄만 바꿨을 뿐인데\n제가 어떤 가을 옷을 좋아하는지 보이더라구요.\n\n안 입는 옷은 따로 봉투에 담아 두었어요.\n한 달 동안 한 번도 꺼내지 않으면\n그때 나눔을 하거나 정리하려고 해요.\n\n[이미지 6] 태그가 달린 채 걸려 있는 셔츠 한 장\n\n인용구(소제목) 앞줄 정리가 잘 맞는 사람, 아닌 사람\n\n앞줄만 바꾸는 옷장 정리는\n바쁜 평일에 조금씩 하고 싶은 분께 잘 맞아요.\n옷장 앞에서 매일 고민하는 시간이 줄어요.\n\n반대로 옷장 자체가 꽉 차서\n앞뒤 구분이 안 되는 상태라면\n주말에 한 번 크게 비우는 게 먼저일 수 있어요.\n저도 내년 봄엔 그렇게 해볼 생각이에요.\n어느 쪽이든 내 옷장 상태에 맞추는 게 먼저예요.\n\n인용구(소제목) 주변에서 물어본 것들\n\n환절기 옷은 몇 벌이나 앞에 두는지 물어보더라구요.\n저는 일주일 동안 돌려 입을 만큼만 두었어요.\n너무 많으면 다시 고민이 시작되거든요.\n환절기 옷은 적게 두고 자주 바꾸는 게 편했어요.\n\n일교차 때문에 매일 뭘 입을지\n고민이라는 친구도 있었어요.\n저는 전날 밤 일기예보를 보고\n아침 기온에 맞춰 겉옷 하나만 미리 골라 둬요.\n낮 기온과의 차이를 보면 뭘 들고 갈지 정해지더라구요.\n\n가을 옷을 새로 사야 하느냐고 묻는 친구도 있었어요.\n저는 정리하고 나서 오히려 살 게 줄었어요.\n안 입던 옷 중에 괜찮은 게 꽤 있었거든요.\n옷장 정리를 먼저 하고 사는 게 순서 같아요.\n\n[이미지 7] 침대 위에 다음 날 입을 옷을 펼쳐 둔 모습\n\n인용구(소제목) 오늘의 옷장 정리를 마치며\n\n[빨간글씨]옷장 정리는 한 번에 다 하지 않아도 괜찮아요.\n맨 앞줄만 바꿔도 아침이 가벼워져요.[/빨간글씨]\n\n내일 아침엔 옷장 앞에서\n오래 서 있지 않아도 될 것 같아요.\n카디건을 찾느라 뒤적이지 않아도 되고요.\n계절이 바뀌는 걸 옷장에서 먼저 느낀 하루였어요.\n앞줄에 걸린 가을 옷을 보니 괜히 설레더라구요.\n\n혹시 오늘 아침 저처럼 옷장 앞에서 멈칫하셨다면\n이번 주엔 앞줄 하나만 바꿔 보세요.\n생각보다 금방 끝나더라구요.\n옷 몇 벌 옮겼을 뿐인데\n아침 시간이 조금 여유로워졌어요.\n\n[이미지 8] 가을 옷으로 바뀐 옷장 앞줄 전체 모습\n\n이 글은 제 옷장 정리 경험을\n2026년 10월 1일 기준으로 기록했습니다.\n좋아요·공감과 이웃추가 부탁드려요💙\n이상 성글벙글의 일상 기록 포스팅이었습니다😎", "images": [{"t": "가을 햇살이 드는 방, 옷장 앞에 선 모습 (대표사진)", "n": "대표사진. 위쪽 3분의 1은 비워 제목 자리", "p": "In a room with autumn sunlight, the blog host stands in front of an open wardrobe thinking, hand on chin. Seonggeul, the blog host: a Korean woman in her 30s, round face, dark hair in a low bun, cream sweater with a mint scarf. Soft matte clay 3D render, rounded chunky shapes, handmade plasticine texture, gentle soft studio lighting, pastel colors, clean simple background, cozy and warm mood, miniature diorama feel. Use mainly these colors: cream (#F6EFE3) background, apricot (#F2B8A0), mint (#A8D8C8), soft sky blue (#A9C8E8), warm brown (#8A6A55). Korean people and Korean everyday settings. Friendly, calm expressions. No syringes, no needles, no blood, no one in pain, nothing scary. Do not include any text, letters, numbers, logos or watermarks in the image   <header>
    <div class="htop">

    <b>네이버용 서식 복사</b>를 누르면 빨간 글씨와 노란 형광펜이 <b>서식 그대로</b> 붙여넣어집니다.
    에디터 본문을 클릭하고 Ctrl+V 하세요.<br>
    <b>[이미지 N]</b> 줄은 사진 넣을 자리 표시예요. 사진을 올린 뒤 그 줄은 지우시면 됩니다.
  </p>
</div>

<script>
const PRISTINE = "<!doctype html>\n" + document.documentElement.outerHTML;
const S = JSON.parse(document.getElementById("state").textContent);
const NEXT = {todo:"doing", doing:"done", done:"todo"};
const LABEL = {todo:"미완료", doing:"작성중", done:"작성완료"};
const RED = "#cc0000", BLUE = "#0b4da2", YEL = "#ffe97a", INK = "#000000";
const BASE = `color:${INK};`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const tidy = t => t
  .replace(/\n{2,}(?=\[이미지)/g, "\n").replace(/(^\[이미지.*$)\n{2,}/gm, "$1\n")
  .replace(/\n{2,}(?=인용구\(소제목\))/g, "\n").replace(/(^인용구\(소제목\).*$)\n{2,}/gm, "$1\n");

/* 화면 표시용 */
function paint(t){
  return esc(tidy(t))
    .replace(/^\[이미지\s*(\d+)\]\s*(.*)$/gm, '<span class="im">📷 이미지 $1 — $2</span>')
    .replace(/^인용구\(소제목\)\s*(.*)$/gm, '<span class="qt">$1</span>')
    .replace(/\[빨간글씨\]([\s\S]*?)\[\/빨간글씨\]/g, '<span class="rd">$1</span>')
    .replace(/\[파란글씨\]([\s\S]*?)\[\/파란글씨\]/g, '<span class="bl">$1</span>')
    .replace(/\[노란배경\]([\s\S]*?)\[\/노란배경\]/g, '<span class="yl">$1</span>');
}

/* 네이버 에디터에 붙여넣을 HTML. 인라인 style 이라야 서식이 살아서 들어간다.
   tidy() 는 화면 표시용이다. 여기서 쓰면 인용구·이미지 줄이 앞 문단에 붙어버린다. */
function toNaverHtml(t, keepImg){
  const parts = [];
  for (const block of t.trim().split(/\n\s*\n/)) {
    const lines = block.split("\n").map(l => l.trim()).filter(Boolean);
    const first = lines[0] || "";
    if (/^\[이미지\s*\d+\]/.test(first)) {
      if (keepImg) parts.push(`<p style="color:#999999;">${esc(first)}</p>`);
      continue;
    }
    if (first.startsWith("인용구(소제목)")) {
      // 네이버는 blockquote 를 자기 인용구 컴포넌트로 바꾼다(확인함).
      // 따옴표 장식과 정렬은 에디터가 직접 그리므로 여기서 넣으면 중복된다.
      // 인용구 종류(4번)는 붙여넣기로 지정할 수 없어 에디터에서 골라야 한다.
      const qt = esc(first.replace(/^인용구\(소제목\)\s*/, ""));
      parts.push(`<blockquote><p style="${BASE}">${qt}</p></blockquote>`);
      continue;
    }
    // 줄마다 별도 <p> 로 내보낸다.
    // <br> 은 네이버가 버려서 여러 줄이 한 줄로 뭉친다(확인함).
    // 문단의 기본 글자색도 반드시 명시한다. 없으면 앞 문단의 빨간색을
    // 그대로 상속해 본문 전체가 빨갛게 붙여넣어진다.
    const pieces = [];
    let carry = null;
    for (const line of lines) {
      const opens  = [...line.matchAll(/\[(빨간글씨|파란글씨|노란배경)\]/g)];
      const closes = [...line.matchAll(/\[\/(빨간글씨|파란글씨|노란배경)\]/g)];
      const applied = opens.length ? opens[0][1] : carry;
      if (opens.length && !closes.length) carry = opens[opens.length - 1][1];
      else if (closes.length) carry = null;

      const txt = esc(line.replace(/\[\/?(빨간글씨|파란글씨|노란배경)\]/g, "").trim());
      if (!txt) continue;
      pieces.push(
        applied === "빨간글씨" ? `<span style="color:${RED};font-weight:bold;">${txt}</span>` :
        applied === "파란글씨" ? `<span style="color:${BLUE};font-weight:bold;">${txt}</span>` :
        applied === "노란배경" ? `<span style="color:${INK};background-color:${YEL};font-weight:bold;">${txt}</span>` :
        txt);
    }
    for (const piece of pieces) parts.push(`<p style="${BASE}">${piece}</p>`);
    // 덩어리 사이 빈 줄
    if (pieces.length) parts.push(`<p style="${BASE}"><br></p>`);
  }
  while (parts.length && /^<p[^>]*><br><\/p>$/.test(parts[parts.length - 1])) parts.pop();
  return parts.join("\n");
}

/* 서식 없이 텍스트만 */
function toPlain(t, keepImg){
  return tidy(t).split("\n")
    .filter(l => keepImg || !/^\[이미지\s*\d+\]/.test(l.trim()))
    .map(l => l.replace(/^인용구\(소제목\)\s*/, "").replace(/\[\/?(빨간글씨|파란글씨|노란배경)\]/g, ""))
    .join("\n").replace(/\n{3,}/g, "\n\n").trim();
}

function flash(btn, msg){
  const was = btn.dataset.label || btn.textContent;
  btn.dataset.label = was;
  btn.textContent = msg || "복사됐어요";
  btn.classList.add("ok");
  setTimeout(() => { btn.textContent = was; btn.classList.remove("ok"); }, 1600);
}

async function copyRich(html, plain, btn){
  let done = false;
  try {
    if (window.ClipboardItem && navigator.clipboard && navigator.clipboard.write) {
      await navigator.clipboard.write([new ClipboardItem({
        "text/html":  new Blob([html],  {type: "text/html"}),
        "text/plain": new Blob([plain], {type: "text/plain"}),
      })]);
      done = true;
    }
  } catch { /* 아래 방식으로 다시 시도 */ }
  if (!done) {
    // 보이지 않는 편집영역을 선택해 복사하면 서식이 함께 실린다
    const d = document.createElement("div");
    d.contentEditable = "true";
    d.innerHTML = html;
    d.style.cssText = "position:fixed;left:-9999px;top:0;white-space:pre-wrap;";
    document.body.appendChild(d);
    const r = document.createRange(); r.selectNodeContents(d);
    const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
    try { document.execCommand("copy"); } catch {}
    sel.removeAllRanges(); d.remove();
  }
  flash(btn);
}

async function copyText(text, btn){
  try { await navigator.clipboard.writeText(text); }
  catch {
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.cssText = "position:fixed;left:-9999px";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch {}
    ta.remove();
  }
  flash(btn);
}

function render(){
  const p = S[0];
  document.getElementById("meta").innerHTML =
    `오늘 <b>${S.filter(x=>x.status==="done").length} / ${S.length}</b> 완료<br>10월 1일 (목) 발행분`;

  document.getElementById("list").innerHTML = S.map((p,i) => { const has = !!(p.body && p.body.trim()); return `
   <article class="card ${p.status}">
    <div class="chead">
      <div>
        ${p.date ? `<div class="kv" style="margin:0 0 4px"><span><b>${esc(p.date)}</b></span><span>${esc(p.type||"")}</span><span>${esc(p.note||"")}</span></div>` : ""}
        <h2 class="ctitle">${esc(p.title)}</h2>
        ${has ? "" : `<div class="kv"><span>원고 작성 전</span></div>`}
        <div class="kv" ${has ? "" : "hidden"}>
          <span>메인 <b>${esc(p.main)}</b> ${p.mainN}회</span>
          <span>검색량 <b>${esc(p.vol)}</b></span>
          <span>본문 <b>${p.chars}자</b> (공백 포함)</span>
        </div>
        <div class="kv" ${has ? "" : "hidden"}><span>서브 <code>${p.subs.map(esc).join(" · ")}</code></span></div>
      </div>
      <button class="pill ${p.status}" data-act="cycle" data-i="${i}">${LABEL[p.status]}</button>
    </div>
    <div class="actions" ${has ? "" : "hidden"}>
      <button class="btn pri" data-act="copy-rich" data-i="${i}">네이버용 서식 복사</button>
      <button class="btn" data-act="copy-plain" data-i="${i}">텍스트만 복사</button>
      <button class="btn" data-act="copy-tags" data-i="${i}">태그 복사</button>
      <button class="btn" data-act="toggle" data-i="${i}" data-t="ms">원고 보기</button>
      <button class="btn" data-act="toggle" data-i="${i}" data-t="img">이미지 프롬프트 ${p.images.length}장</button>
    </div>
    <p class="hint" ${has ? "" : "hidden"}>빨간·파란 글씨와 연한 노란 형광펜이 그대로 들어가요. 소제목은 인용구로 바뀌는데, 종류(4번)는 붙여넣은 뒤 에디터에서 골라주세요.</p>

    <div class="panel" id="ms${i}" hidden>
      <p class="ptitle">원고 전문</p>
      <pre class="ms">${paint(p.body)}</pre>
    </div>

    <div class="panel" id="img${i}" hidden>
      <p class="ptitle">이미지 프롬프트 — 한 장씩 복사해서 쓰세요</p>
      ${p.images.map((im,j) => `
        <div class="im-item">
          <div class="im-top">
            <span class="im-n">${j+1}</span>
            <div style="flex:1">
              <div class="im-t">${esc(im.t)}</div>
              <div class="im-note">${esc(im.n)}</div>
            </div>
          </div>
          <div class="im-p">${esc(im.p)}</div>
          <div class="im-act">
            <button class="btn" data-act="copy-prompt" data-i="${i}" data-j="${j}">프롬프트 복사</button>
          </div>
        </div>`).join("")}
      <p class="ptitle" style="margin-top:16px">해시태그 15개</p>
      <div class="tagline">${esc(p.tags)}</div>
    </div>
   </article>`; }).join("");
}

let saving = false;
async function save(){
  if (saving) return;
  saving = true;
  try {
    const api = await claude.use("artifact");
    if (!api) return;
    await api.publish(PRISTINE.replace(/(<script id="state"[^>]*>)[\s\S]*?(<\/script>)/,
      (m,a,b) => a + JSON.stringify(S).replace(/<\//g, "<\\/") + b));
  } catch { /* conflict 면 모든 창이 최신본으로 새로고침된다 */ }
  finally { saving = false; }
}

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b) return;
  const p = S[+b.dataset.i];
  switch (b.dataset.act) {
    case "cycle": p.status = NEXT[p.status]; render(); save(); break;
    case "toggle": {
      const el = document.getElementById(b.dataset.t + b.dataset.i);
      el.hidden = !el.hidden;
      b.textContent = el.hidden ? (b.dataset.t === "ms" ? "원고 보기" : `이미지 프롬프트 ${p.images.length}장`) : "접기";
      break;
    }
    case "copy-rich":   copyRich(toNaverHtml(p.body, true), toPlain(p.body, true), b); break;
    case "copy-plain":  copyText(toPlain(p.body, true), b); break;
    case "copy-tags":   copyText(p.tags, b); break;
    case "copy-prompt": copyText(p.images[+b.dataset.j].p, b); break;
  }
});

render();
</script>
