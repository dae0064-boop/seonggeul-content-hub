<title>성글벙글 원고 작업실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@300;400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#f4f3f1; --card:#fff; --card2:#faf9f7;
  --ink:#1b1e24; --ink2:#5c6570; --ink3:#8d959e;
  --line:#e0dfdb; --line2:#eeedea;
  --todo:#c2362b; --todo-bg:#fbe9e7;
  --doing:#a06b02; --doing-bg:#fdf2da;
  --done:#15764a; --done-bg:#e2f2ea;
  --sans:"Gothic A1",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14161a; --card:#1d2025; --card2:#191c20;
  --ink:#e9ebee; --ink2:#a0a8b2; --ink3:#737b85;
  --line:#2e333a; --line2:#242930;
  --todo:#f08478; --todo-bg:#3a1f1c;
  --doing:#e2ab3c; --doing-bg:#352a12;
  --done:#5cc493; --done-bg:#123528;
}}
:root[data-theme="dark"]{
  --bg:#14161a; --card:#1d2025; --card2:#191c20;
  --ink:#e9ebee; --ink2:#a0a8b2; --ink3:#737b85;
  --line:#2e333a; --line2:#242930;
  --todo:#f08478; --todo-bg:#3a1f1c;
  --doing:#e2ab3c; --doing-bg:#352a12;
  --done:#5cc493; --done-bg:#123528;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:300;line-height:1.65;-webkit-font-smoothing:antialiased}
.wrap{max-width:860px;margin:0 auto;padding-inline:18px;padding-block:34px 70px}
header{border-bottom:2px solid var(--ink);padding-bottom:15px}
.htop{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:flex-end;justify-content:space-between}
h1{font-size:clamp(23px,4.2vw,32px);font-weight:700;margin:0;letter-spacing:-.02em}
.sub{color:var(--ink2);font-size:13.5px;margin-top:6px;max-width:56ch}
.meta{font-family:var(--mono);font-size:11.5px;color:var(--ink2);text-align:right;line-height:1.8}

.card{background:var(--card);border:1px solid var(--line);border-radius:6px;margin-top:16px;overflow:hidden}
.card.todo{border-left:4px solid var(--todo)}
.card.doing{border-left:4px solid var(--doing)}
.card.done{border-left:4px solid var(--done)}
.chead{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start;padding:15px 16px 12px}
.ctitle{font-size:17px;font-weight:500;line-height:1.45;margin:0;letter-spacing:-.01em}
.kv{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px;font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
.kv b{font-weight:500;color:var(--ink)}
.kv code{font-family:var(--mono);font-size:11.5px}
.pill{border:0;cursor:pointer;font-family:var(--sans);font-size:12px;font-weight:500;padding:6px 14px;border-radius:20px;white-space:nowrap}
.pill:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.pill.todo{background:var(--todo-bg);color:var(--todo)}
.pill.doing{background:var(--doing-bg);color:var(--doing)}
.pill.done{background:var(--done-bg);color:var(--done)}

.actions{display:flex;flex-wrap:wrap;gap:7px;padding:0 16px 15px}
.btn{background:var(--card2);border:1px solid var(--line);color:var(--ink);font-family:var(--sans);
  font-size:12.5px;padding:7px 13px;border-radius:4px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink3)}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.btn.pri{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:500}
.btn.ok{background:var(--done-bg)!important;border-color:var(--done)!important;color:var(--done)!important}
.hint{padding:0 16px 14px;font-size:12px;color:var(--ink3);line-height:1.6}

.panel{border-top:1px solid var(--line2);padding:16px;background:var(--card2)}
.ptitle{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);margin:0 0 11px}
pre.ms{margin:0;white-space:pre-wrap;word-break:break-word;font-family:var(--sans);font-size:14px;line-height:1.85;
  background:var(--card);border:1px solid var(--line);border-radius:4px;padding:16px;max-height:520px;overflow:auto}
pre.ms .im{display:block;background:var(--doing-bg);color:var(--doing);border-radius:3px;padding:4px 9px;
  margin:14px 0;font-family:var(--mono);font-size:12px}
pre.ms .rd{color:#cc0000;font-weight:700}
pre.ms .bl{color:#0b4da2;font-weight:700}
pre.ms .yl{background:#ffe97a;color:#14161a;font-weight:700;border-radius:2px;padding:0 3px}
pre.ms .qt{display:block;font-weight:700;border-left:3px solid var(--ink3);padding-left:11px;margin:22px 0 9px}

.im-item{border:1px solid var(--line);border-radius:5px;background:var(--card);padding:13px 14px;margin-bottom:9px}
.im-top{display:flex;gap:10px;align-items:flex-start}
.im-n{font-family:var(--mono);font-size:11px;color:#fff;background:var(--ink3);
  width:23px;height:23px;border-radius:50%;display:grid;place-items:center;flex:none;margin-top:1px}
.im-t{font-size:14px;font-weight:500}
.im-note{font-size:12.5px;color:var(--ink2);margin-top:3px;line-height:1.6}
.im-p{font-family:var(--mono);font-size:11.5px;line-height:1.65;color:var(--ink2);background:var(--card2);
  border:1px solid var(--line2);border-radius:4px;padding:9px 11px;margin:9px 0 8px;word-break:break-word}
.im-act{display:flex;gap:6px;flex-wrap:wrap}
.tagline{font-size:12px;color:var(--ink2);line-height:1.8;word-break:keep-all;background:var(--card);
  border:1px solid var(--line);border-radius:4px;padding:11px 13px}
[hidden]{display:none!important}
.note{margin-top:26px;border-top:1px solid var(--line);padding-top:14px;font-size:12.5px;color:var(--ink3);line-height:1.75}
.note b{color:var(--ink2)}
@media(max-width:560px){ .meta{text-align:left} .btn{font-size:12px;padding:7px 11px} }
</style>

<script id="state" type="application/json">[]</script>

<div class="wrap">
  <header>
    <div class="htop">
      <div>
        <h1>원고 작업실</h1>
        <p class="sub">상태를 누르면 미완료 → 작성중 → 완료로 바뀌고 저장돼요.</p>
      </div>
      <div class="meta" id="meta"></div>
    </div>
  </header>
  <main id="list"></main>
  <p class="note">
    <b>네이버용 서식 복사</b>를 누르면 빨간 글씨와 노란 형광펜이 <b>서식 그대로</b> 붙여넣어집니다.
    에디터 본문을 클릭하고 Ctrl+V 하세요.<br>
    <b>[이미지 N]</b> 줄은 사진 넣을 자리 표시예요. 사진을 올린 뒤 그 줄은 지우시면 됩니다.
  </p>
</div>

<script>
const PRISTINE = "<!doctype html>\n" + document.documentElement.outerHTML;
const S = JSON.parse(document.getElementById("state").textContent);
const NEXT = {todo:"doing", doing:"done", done:"todo"};
const LABEL = {todo:"미완료", doing:"작성중", done:"작성완료"};
const RED = "#cc0000", BLUE = "#0b4da2", YEL = "#ffe97a", INK = "#000000";
const BASE = `color:${INK};`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const tidy = t => t
  .replace(/\n{2,}(?=\[이미지)/g, "\n").replace(/(^\[이미지.*$)\n{2,}/gm, "$1\n")
  .replace(/\n{2,}(?=인용구\(소제목\))/g, "\n").replace(/(^인용구\(소제목\).*$)\n{2,}/gm, "$1\n");

/* 화면 표시용 */
function paint(t){
  return esc(tidy(t))
    .replace(/^\[이미지\s*(\d+)\]\s*(.*)$/gm, '<span class="im">📷 이미지 $1 — $2</span>')
    .replace(/^인용구\(소제목\)\s*(.*)$/gm, '<span class="qt">$1</span>')
    .replace(/\[빨간글씨\]([\s\S]*?)\[\/빨간글씨\]/g, '<span class="rd">$1</span>')
    .replace(/\[파란글씨\]([\s\S]*?)\[\/파란글씨\]/g, '<span class="bl">$1</span>')
    .replace(/\[노란배경\]([\s\S]*?)\[\/노란배경\]/g, '<span class="yl">$1</span>');
}

/* 네이버 에디터에 붙여넣을 HTML. 인라인 style 이라야 서식이 살아서 들어간다.
   tidy() 는 화면 표시용이다. 여기서 쓰면 인용구·이미지 줄이 앞 문단에 붙어버린다. */
function toNaverHtml(t, keepImg){
  const parts = [];
  for (const block of t.trim().split(/\n\s*\n/)) {
    const lines = block.split("\n").map(l => l.trim()).filter(Boolean);
    const first = lines[0] || "";
    if (/^\[이미지\s*\d+\]/.test(first)) {
      if (keepImg) parts.push(`<p style="color:#999999;">${esc(first)}</p>`);
      continue;
    }
    if (first.startsWith("인용구(소제목)")) {
      // 네이버는 blockquote 를 자기 인용구 컴포넌트로 바꾼다(확인함).
      // 따옴표 장식과 정렬은 에디터가 직접 그리므로 여기서 넣으면 중복된다.
      // 인용구 종류(4번)는 붙여넣기로 지정할 수 없어 에디터에서 골라야 한다.
      const qt = esc(first.replace(/^인용구\(소제목\)\s*/, ""));
      parts.push(`<blockquote><p style="${BASE}">${qt}</p></blockquote>`);
      continue;
    }
    // 줄마다 별도 <p> 로 내보낸다.
    // <br> 은 네이버가 버려서 여러 줄이 한 줄로 뭉친다(확인함).
    // 문단의 기본 글자색도 반드시 명시한다. 없으면 앞 문단의 빨간색을
    // 그대로 상속해 본문 전체가 빨갛게 붙여넣어진다.
    const pieces = [];
    let carry = null;
    for (const line of lines) {
      const opens  = [...line.matchAll(/\[(빨간글씨|파란글씨|노란배경)\]/g)];
      const closes = [...line.matchAll(/\[\/(빨간글씨|파란글씨|노란배경)\]/g)];
      const applied = opens.length ? opens[0][1] : carry;
      if (opens.length && !closes.length) carry = opens[opens.length - 1][1];
      else if (closes.length) carry = null;

      const txt = esc(line.replace(/\[\/?(빨간글씨|파란글씨|노란배경)\]/g, "").trim());
      if (!txt) continue;
      pieces.push(
        applied === "빨간글씨" ? `<span style="color:${RED};font-weight:bold;">${txt}</span>` :
        applied === "파란글씨" ? `<span style="color:${BLUE};font-weight:bold;">${txt}</span>` :
        applied === "노란배경" ? `<span style="color:${INK};background-color:${YEL};font-weight:bold;">${txt}</span>` :
        txt);
    }
    for (const piece of pieces) parts.push(`<p style="${BASE}">${piece}</p>`);
    // 덩어리 사이 빈 줄
    if (pieces.length) parts.push(`<p style="${BASE}"><br></p>`);
  }
  while (parts.length && /^<p[^>]*><br><\/p>$/.test(parts[parts.length - 1])) parts.pop();
  return parts.join("\n");
}

/* 서식 없이 텍스트만 */
function toPlain(t, keepImg){
  return tidy(t).split("\n")
    .filter(l => keepImg || !/^\[이미지\s*\d+\]/.test(l.trim()))
    .map(l => l.replace(/^인용구\(소제목\)\s*/, "").replace(/\[\/?(빨간글씨|파란글씨|노란배경)\]/g, ""))
    .join("\n").replace(/\n{3,}/g, "\n\n").trim();
}

function flash(btn, msg){
  const was = btn.dataset.label || btn.textContent;
  btn.dataset.label = was;
  btn.textContent = msg || "복사됐어요";
  btn.classList.add("ok");
  setTimeout(() => { btn.textContent = was; btn.classList.remove("ok"); }, 1600);
}

async function copyRich(html, plain, btn){
  let done = false;
  try {
    if (window.ClipboardItem && navigator.clipboard && navigator.clipboard.write) {
      await navigator.clipboard.write([new ClipboardItem({
        "text/html":  new Blob([html],  {type: "text/html"}),
        "text/plain": new Blob([plain], {type: "text/plain"}),
      })]);
      done = true;
    }
  } catch { /* 아래 방식으로 다시 시도 */ }
  if (!done) {
    // 보이지 않는 편집영역을 선택해 복사하면 서식이 함께 실린다
    const d = document.createElement("div");
    d.contentEditable = "true";
    d.innerHTML = html;
    d.style.cssText = "position:fixed;left:-9999px;top:0;white-space:pre-wrap;";
    document.body.appendChild(d);
    const r = document.createRange(); r.selectNodeContents(d);
    const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
    try { document.execCommand("copy"); } catch {}
    sel.removeAllRanges(); d.remove();
  }
  flash(btn);
}

async function copyText(text, btn){
  try { await navigator.clipboard.writeText(text); }
  catch {
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.cssText = "position:fixed;left:-9999px";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch {}
    ta.remove();
  }
  flash(btn);
}

function render(){
  document.getElementById("meta").innerHTML =
    S.length ? `오늘 <b>${S.filter(x=>x.status==="done").length} / ${S.length}</b> 완료` : "";
  if (!S.length) {
    document.getElementById("list").innerHTML =
      `<p class="note" style="border:0">지금 올릴 원고가 없어요. 예약발행을 마친 글은 여기서 지웠어요.</p>`;
    return;
  }

  document.getElementById("list").innerHTML = S.map((p,i) => { const has = !!(p.body && p.body.trim()); return `
   <article class="card ${p.status}">
    <div class="chead">
      <div>
        ${p.date ? `<div class="kv" style="margin:0 0 4px"><span><b>${esc(p.date)}</b></span><span>${esc(p.type||"")}</span><span>${esc(p.note||"")}</span></div>` : ""}
        <h2 class="ctitle">${esc(p.title)}</h2>
        ${has ? "" : `<div class="kv"><span>원고 작성 전</span></div>`}
        <div class="kv" ${has ? "" : "hidden"}>
          <span>메인 <b>${esc(p.main)}</b> ${p.mainN}회</span>
          <span>검색량 <b>${esc(p.vol)}</b></span>
          <span>본문 <b>${p.chars}자</b> (공백 포함)</span>
        </div>
        <div class="kv" ${has ? "" : "hidden"}><span>서브 <code>${p.subs.map(esc).join(" · ")}</code></span></div>
      </div>
      <button class="pill ${p.status}" data-act="cycle" data-i="${i}">${LABEL[p.status]}</button>
    </div>
    <div class="actions" ${has ? "" : "hidden"}>
      <button class="btn pri" data-act="copy-rich" data-i="${i}">네이버용 서식 복사</button>
      <button class="btn" data-act="copy-plain" data-i="${i}">텍스트만 복사</button>
      <button class="btn" data-act="copy-tags" data-i="${i}">태그 복사</button>
      <button class="btn" data-act="toggle" data-i="${i}" data-t="ms">원고 보기</button>
      <button class="btn" data-act="toggle" data-i="${i}" data-t="img">이미지 프롬프트 ${p.images.length}장</button>
    </div>
    <p class="hint" ${has ? "" : "hidden"}>빨간·파란 글씨와 연한 노란 형광펜이 그대로 들어가요. 소제목은 인용구로 바뀌는데, 종류(4번)는 붙여넣은 뒤 에디터에서 골라주세요.</p>

    <div class="panel" id="ms${i}" hidden>
      <p class="ptitle">원고 전문</p>
      <pre class="ms">${paint(p.body)}</pre>
    </div>

    <div class="panel" id="img${i}" hidden>
      <p class="ptitle">이미지 프롬프트 — 한 장씩 복사해서 쓰세요</p>
      ${p.images.map((im,j) => `
        <div class="im-item">
          <div class="im-top">
            <span class="im-n">${j+1}</span>
            <div style="flex:1">
              <div class="im-t">${esc(im.t)}</div>
              <div class="im-note">${esc(im.n)}</div>
            </div>
          </div>
          <div class="im-p">${esc(im.p)}</div>
          <div class="im-act">
            <button class="btn" data-act="copy-prompt" data-i="${i}" data-j="${j}">프롬프트 복사</button>
          </div>
        </div>`).join("")}
      <p class="ptitle" style="margin-top:16px">해시태그 15개</p>
      <div class="tagline">${esc(p.tags)}</div>
    </div>
   </article>`; }).join("");
}

let saving = false;
async function save(){
  if (saving) return;
  saving = true;
  try {
    const api = await claude.use("artifact");
    if (!api) return;
    await api.publish(PRISTINE.replace(/(<script id="state"[^>]*>)[\s\S]*?(<\/script>)/,
      (m,a,b) => a + JSON.stringify(S).replace(/<\//g, "<\\/") + b));
  } catch { /* conflict 면 모든 창이 최신본으로 새로고침된다 */ }
  finally { saving = false; }
}

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b) return;
  const p = S[+b.dataset.i];
  switch (b.dataset.act) {
    case "cycle": p.status = NEXT[p.status]; render(); save(); break;
    case "toggle": {
      const el = document.getElementById(b.dataset.t + b.dataset.i);
      el.hidden = !el.hidden;
      b.textContent = el.hidden ? (b.dataset.t === "ms" ? "원고 보기" : `이미지 프롬프트 ${p.images.length}장`) : "접기";
      break;
    }
    case "copy-rich":   copyRich(toNaverHtml(p.body, true), toPlain(p.body, true), b); break;
    case "copy-plain":  copyText(toPlain(p.body, true), b); break;
    case "copy-tags":   copyText(p.tags, b); break;
    case "copy-prompt": copyText(p.images[+b.dataset.j].p, b); break;
  }
});

render();
</script>
