<style>

.note{margin-top:26px;border-top:1px solid var(--line);padding-top:14px;font-size:12.5px;color:var(--ink3);line-height:1.75}

니다.\n먼지를 한 번 털어낸 다음 미지근한 물로 헹구면 돼요.\n세제는 따로 쓰지 않아도 괜찮습니다.\n\n뜨거운 물은 피해주세요.\n필터가 휘어지면 제자리에 안 들어갑니다.\n\n[노란배경]덜 마른 에어컨 필터를 그대로 끼우면\n그 안에서 곰팡이가 자랍니다.[/노란배경]\n\n그늘에서 바싹 말린 뒤에 넣어주세요.\n\n[이미지 5] 물에 헹구는 필터 (애프터)\n\n셋째, 겉면과 바람 나오는 곳을 닦습니다.\n마른 걸레로 먼지를 걷어낸 뒤\n물기를 짠 걸레로 한 번 더 닦아요.\n날개 쪽에 먼지가 많이 끼어 있는데\n면봉을 쓰면 안쪽까지 닿아요.\n\n[이미지 6] 그늘에서 말리는 필터\n\n넷째, 전원을 뽑고 덮습니다.\n에어컨 필터까지 완전히 마른 것을\n확인한 다음에 덮어주세요.\n\n플러그를 뽑아두면 대기전력도 줄어들고,\n리모컨 건전지도 빼두시면 좋아요.\n오래 두면 액이 새서 접점이 상하는 경우가 있더라구요.\n\n인용구(소제목) 이건 되고, 이건 안 됩니다\n\n되는 경우부터 말씀드릴게요.\n[파란글씨]송풍으로 말린 뒤\n천으로 된 에어컨 커버를 씌우는 방식이에요.[/파란글씨]\n\n먼지는 막아주면서 습기는 빠져나갑니다.\n전용 에어컨 커버가 없으시면\n얇은 이불보를 덮어두셔도 충분해요.\n\n안 되는 경우는 제가 작년에 한 방식입니다.\n[빨간글씨]젖은 상태에서 비닐 커버로 꽉 덮어버리는 것이에요.[/빨간글씨]\n\n같은 커버인데 소재 하나로 결과가 갈리더라구요.\n\n실외기 커버도 같은 이야기예요.\n밀폐형 실외기 커버로 감싸면\n오히려 안에 습기가 갇힙니다.\n\n실외기는 처음부터 비바람을 맞도록 만들어진 물건이라,\n실외기 커버를 굳이 씌우지 않으셔도 괜찮더라구요.\n\n[파란글씨]감싸지 않는 쪽이 오히려 낫습니다.[/파란글씨]\n\n[이미지 7] 천 커버 vs 비닐 커버 비교 컷\n\n인용구(소제목) 덮기 전에 확인할 다섯 가지\n\n첫째, 에어컨 필터가 속까지 말랐는지 확인하세요.\n[노란배경]겉만 만져보면 속습니다.[/노란배경]\n둘째, 에어컨 커버 소재가 천인지 비닐인지 봅니다.\n사이즈는 넉넉한 쪽이 오히려 나아요.\n\n셋째, 플러그를 뽑았는지 확인합니다.\n넷째, 실외기 위에 낙엽이나 물건이 없는지 봅니다.\n다섯째, 리모컨 건전지를 뺐는지\n마지막으로 한 번 더 확인하세요.\n\n[이미지 8] 체크리스트 다섯 줄 카드 이미지\n\n인용구(소제목) 많이 궁금해하시는 것들\n\n에어컨 필터만 씻어도 되는지 물으시는데,\n필터는 직접 하실 수 있는 범위가 맞아요.\n다만 안쪽 열교환기나 송풍팬은 분해해야 손이 닿습니다.\n[파란글씨]냄새가 심하다면 전문 에어컨 청소를\n부르시는 편이 안전해요.[/파란글씨]\n\n무리해서 뜯다가 부품이 상하는 경우가 많더라구요.\n\n에어컨 커버를 꼭 씌워야 하는지도 자주 여쭤보시는데,\n안 씌워도 큰 문제가 생기지는 않아요.\n먼지 관리 차원이라 에어컨 커버를 씌우신다면\n소재만 천으로 골라주세요.\n실외기 커버는 씌우지 않는 쪽을 권합니다.\n\n전문 청소 주기는 쓰는 환경에 따라 달라서\n딱 잘라 말씀드리기 어려워요.\n평소 관리를 해두시면 주기는 자연스럽게 길어집니다.\n\n[이미지 9] 자주 묻는 질문 요약 카드\n\n인용구(소제목) 오늘 정리하면\n\n[파란글씨]송풍으로 말리기 → 에어컨 필터 세척 후 완전 건조 →\n겉면 닦기 → 전원 뽑고 천 커버 →\n실외기 커버는 씌우지 않기[/파란글씨]\n\n순서를 바꾸면 소용이 없어요.\n말리는 단계가 언제나 먼저입니다.\n올해는 이 순서대로 에어컨 청소를 했는데\n작년처럼 반나절이 아니라 한 시간이면 끝나더라구요.\n\n다만 기종마다 구조가 조금씩 다르니,\n분해가 필요한 부분은\n제조사 사용설명서를 함께 확인해 주세요.\n\n[이미지 10] 정리 끝난 에어컨 + 천 커버 (애프터)\n\n에어컨 청소라고 하면 거창하게 느껴지는데\n막상 해보면 말리고 닦는 게 전부더라구요.\n내년 6월에 켰을 때 냄새 없이 시원한 바람이 나오면,\n오늘 들인 한 시간은 값을 하는 셈이에요.\n\n저는 작년에 그     .replace(/^인용구\(소제목\)\s*(.*)$/gm, '<span class="qt">$1</span>')
    .replace(/\[빨간글씨\]([\s\S]*?)\[\/빨간글씨\]/g, '<span class="rd">$1</span>')
    .replace(/\[파란글씨\]([\s\S]*?)\[\/파란글씨\]/g, '<span class="bl">$1</span>')
    .replace(/\[노란배경\]([\s\S]*?)\[\/노란배경\]/g, '<span class="yl">$1</span>');
}

/* 네이버 에디터에 붙여넣을 HTML. 인라인 style 이라야 서식이 살아서 들어간다.
   tidy() 는 화면 표시용이다. 여기서 쓰면 인용구·이미지 줄이 앞 문단에 붙어버린다. */
function toNaverHtml(t, keepImg){
  const parts = [];
  for (const block of t.trim().split(/\n\s*\n/)) {
    const lines = block.split("\n").map(l => l.trim()).filter(Boolean);
    const first = lines[0] || "";
    if (/^\[이미지\s*\d+\]/.test(first)) {
      if (keepImg) parts.push(`<p style="color:#999999;">${esc(first)}</p>`);
      continue;
    }
    if (first.startsWith("인용구(소제목)")) {
      // 네이버는 blockquote 를 자기 인용구 컴포넌트로 바꾼다(확인함).
      // 따옴표 장식과 정렬은 에디터가 직접 그리므로 여기서 넣으면 중복된다.
      // 인용구 종류(4번)는 붙여넣기로 지정할 수 없어 에디터에서 골라야 한다.
      const qt = esc(first.replace(/^인용구\(소제목\)\s*/, ""));
      parts.push(`<blockquote><p style="${BASE}">${qt}</p></blockquote>`);
      continue;
    }
    // 줄마다 별도 <p> 로 내보낸다.
    // <br> 은 네이버가 버려서 여러 줄이 한 줄로 뭉친다(확인함).
    // 문단의 기본 글자색도 반드시 명시한다. 없으면 앞 문단의 빨간색을
    // 그대로 상속해 본문 전체가 빨갛게 붙여넣어진다.
    const pieces = [];
    let carry = null;
    for (const line of lines) {
      const opens  = [...line.matchAll(/\[(빨간글씨|파란글씨|노란배경)\]/g)];
      const closes = [...line.matchAll(/\[\/(빨간글씨|파란글씨|노란배경)\]/g)];
      const applied = opens.length ? opens[0][1] : carry;
      if (opens.length && !closes.length) carry = opens[opens.length - 1][1];
      else if (closes.length) carry = null;

      const txt = esc(line.replace(/\[\/?(빨간글씨|파란글씨|노란배경)\]/g, "").trim());
      if (!txt) continue;
      pieces.push(
        applied === "빨간글씨" ? `<span style="color:${RED};">${txt}</span>` :
        applied === "파란글씨" ? `<span style="color:${BLUE};">${txt}</span>` :
        applied === "노란배경" ? `<span style="color:${INK};background-color:${YEL};">${txt}</span>` :
        txt);
    }
    for (const piece of pieces) parts.push(`<p style="${BASE}">${piece}</p>`);
    // 덩어리 사이 빈 줄
    if (pieces.length) parts.push(`<p style="${BASE}"><br></p>`);
  }
  while (parts.length && /^<p[^>]*><br><\/p>$/.test(parts[parts.length - 1])) parts.pop();
  return parts.join("\n");
}

/* 서식 없이 텍스트만 */
function toPlain(t, keepImg){
  return tidy(t).split("\n")
    .filter(l => keepImg || !/^\[이미지\s*\d+\]/.test(l.trim()))
    .map(l => l.replace(/^인용구\(소제목\)\s*/, "").replace(/\[\/?(빨간글씨|파란글씨|노란배경)\]/g, ""))
    .join("\n").replace(/\n{3,}/g, "\n\n").trim();
}

function flash(btn, msg){
  const was = btn.dataset.label || btn.textContent;
  btn.dataset.label = was;
  btn.textContent = msg || "복사됐어요";
  btn.classList.add("ok");
  setTimeout(() => { btn.textContent = was; btn.classList.remove("ok"); }, 1600);
}

async function copyRich(html, plain, btn){
  let done = false;
  try {
    if (window.ClipboardItem && navigator.clipboard && navigator.clipboard.write) {
      await navigator.clipboard.write([new ClipboardItem({
        "text/html":  new Blob([html],  {type: "text/html"}),
        "text/plain": new Blob([plain], {type: "text/plain"}),
      })]);
      done = true;
    }
  } catch { /* 아래 방식으로 다시 시도 */ }
  if (!done) {
    // 보이지 않는 편집영역을 선택해 복사하면 서식이 함께 실린다
    const d = document.createElement("div");
    d.contentEditable = "true";
    d.innerHTML = html;
    d.style.cssText = "position:fixed;left:-9999px;top:0;white-space:pre-wrap;";
    document.body.appendChild(d);
    const r = document.createRange(); r.selectNodeContents(d);
    const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
    try { document.execCommand("copy"); } catch {}
    sel.removeAllRanges(); d.remove();
  }
  flash(btn);
}

async function copyText(text, btn){
  try { await navigator.clipboard.writeText(text); }
  catch {
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.cssText = "position:fixed;left:-9999px";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch {}
    ta.remove();
  }
  flash(btn);
}

function render(){
  const p = S[0];
  document.getElementById("meta").innerHTML =
    `오늘 <b>${S.filter(x=>x.status==="done").length} / ${S.length}</b> 완료<br>클러스터 여름·가을 전환 살림`;

  document.getElementById("list").innerHTML = S.map((p,i) => `
   <article class="card ${p.status}">
    <div class="chead">
      <div>
        <h2 class="ctitle">${esc(p.title)}</h2>
        <div class="kv">
          <span>메인 <b>${esc(p.main)}</b> ${p.mainN}회</span>
          <span>검색량 <b>${esc(p.vol)}</b></span>
          <span>본문 <b>${p.chars}자</b> (공백 제외)</span>
        </div>
        <div class="kv"><span>서브 <code>${p.subs.map(esc).join(" · ")}</code></span></div>
      </div>
      <button class="pill ${p.status}" data-act="cycle" data-i="${i}">${LABEL[p.status]}</button>
    </div>
    <div class="actions">
      <button class="btn pri" data-act="copy-rich" data-i="${i}">네이버용 서식 복사</button>
      <button class="btn" data-act="copy-plain" data-i="${i}">텍스트만 복사</button>
      <button class="btn" data-act="copy-tags" data-i="${i}">태그 복사</button>
      <button class="btn" data-act="toggle" data-i="${i}" data-t="ms">원고 보기</button>
      <button class="btn" data-act="toggle" data-i="${i}" data-t="img">이미지 프롬프트 10장</button>
    </div>
    <p class="hint">빨간·파란 글씨와 연한 노란 형광펜이 그대로 들어가요. 소제목은 인용구로 바뀌는데, 종류(4번)는 붙여넣은 뒤 에디터에서 골라주세요.</p>

    <div class="panel" id="ms${i}" hidden>
      <p class="ptitle">원고 전문</p>
      <pre class="ms">${paint(p.body)}</pre>
    </div>

    <div class="panel" id="img${i}" hidden>
      <p class="ptitle">이미지 프롬프트 — 한 장씩 복사해서 쓰세요</p>
      ${p.images.map((im,j) => `
        <div class="im-item">
          <div class="im-top">
            <span class="im-n">${j+1}</span>
            <div style="flex:1">
              <div class="im-t">${esc(im.t)}</div>
              <div class="im-note">${esc(im.n)}</div>
            </div>
          </div>
          <div class="im-p">${esc(im.p)}</div>
          <div class="im-act">
            <button class="btn" data-act="copy-prompt" data-i="${i}" data-j="${j}">프롬프트 복사</button>
          </div>
        </div>`).join("")}
      <p class="ptitle" style="margin-top:16px">해시태그 15개</p>
      <div class="tagline">${esc(p.tags)}</div>
    </div>
   </article>`).join("");
}

let saving = false;
async function save(){
  if (saving) return;
  saving = true;
  try {
    const api = await claude.use("artifact");
    if (!api) return;
    await api.publish(PRISTINE.replace(/(<script id="state"[^>]*>)[\s\S]*?(<\/script>)/,
      (m,a,b) => a + JSON.stringify(S).replace(/<\//g, "<\\/") + b));
  } catch { /* conflict 면 모든 창이 최신본으로 새로고침된다 */ }
  finally { saving = false; }
}

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b) return;
  const p = S[+b.dataset.i];
  switch (b.dataset.act) {
    case "cycle": p.status = NEXT[p.status]; render(); save(); break;
    case "toggle": {
      const el = document.getElementById(b.dataset.t + b.dataset.i);
      el.hidden = !el.hidden;
      b.textContent = el.hidden ? (b.dataset.t === "ms" ? "원고 보기" : "이미지 프롬프트 10장") : "접기";
      break;
    }
    case "copy-rich":   copyRich(toNaverHtml(p.body, true), toPlain(p.body, true), b); break;
    case "copy-plain":  copyText(toPlain(p.body, true), b); break;
    case "copy-tags":   copyText(p.tags, b); break;
    case "copy-prompt": copyText(p.images[+b.dataset.j].p, b); break;
  }
});

render();
</script>
